#
#  = Proxy Configuration
#
#  The `proxy.conf` file is not used in version 4. The functionality
#  in the old proxy.conf has moved.
#
#  For detailed information on upgrading, see:
#  doc/antora/modules/howto/pages/upgrade/index.adoc
#
#  == home_server sections
#
#  The `home_server` definitions are now just RADIUS modules.
#
#  See `mods-available/radius`. You can create a module for each home
#  server. The configuration is very similar.
#
#  You can also send packets to dynamic home servers, without updating
#  the configuration or adding new modules!. See the
#  `%proxy.sendto.ipaddr()` function in `mods-enabled/radius`.
#
#  == home_server_pool sections
#
#  The `home_server_pool` sections are now just virtual modules.  See
#  `mods-available/home_server_pool` for an example.
#
#  See the `load-balance`, `redundant`, and `redundant-load-balance`
#  keywords. Since a `home_server` is now just a RADIUS module, there
#  is no need to have a separate configuration for load-balanced pools
#  of home servers!
#
#  The `load-balance` and `redundant-load-balance` keywords now also
#  take an optional parameter which can be used to do keyed load
#  balancing.
#
#  The `instantiate` section is also gone from v4. Instead, you can
#  just create a "virtual" module, by putting a `load-balance` section
#  as a file directly in the `mods-enabled/` directory.
#
#  i.e. instead of using this in `proxy.conf`:
#
#	home_server_pool foo {
#		type = load-balance
#
#		home_server = radius1
#		home_server = radius2
#		home_server = radius3
#
#	}
#
#  You can instead use this in `mods-enabled/foo`:
#
#	load-balance foo {
#		radius1
#		radius2
#		radius3
#	}
#
#  == Realms
#
#  The `realms` module is gone from v4.  Instead, to split `User-Name` into
#  its component parts, typically the policy `split_username_nai` should
#  be used.  This will take a `User-Name` of the form `user@example.org`
#  and create `Stripped-User-Name` containing `user` and `Stripped-User-Domain`
#  containing `example.org`.
#
#  Proxying routing can then be based on `Stripped-User-Domain`, but rather
#  than any automatic behaviour based on the old `Realm` or `Proxy-To-Realm`
#  attributes, with v4, this should be done with policy.
#
#  One suitable mechanism would be to define an authentication method per
#  realm, then, in `recv Access-Request` set the authentication type to
#  match the realm.
#
#  For example, if a "virtual" module `radius_example_com` is defined for
#  the home servers for `example.com` and `radius_example_org` is defined
#  for `example.com`, the following pattern can be used to proxy based on
#  the `Stripped-User-Domain` extracted from `User-Name`
#
#	recv Access-Request {
#		split_username_nai
#		if (Stripped-User-Domain) {
#			control.Auth-Type = Stripped-User-Domain
#			handled
#		}
#		...
#	}
#
#	authenticate example.com {
#		radius_example_com
#	}
#
#	authenticate example.org {
#		radius_example_org
#	}
#
#  If `User-Name` follows a different format, then suitable regex pattern
#  matching should be used to extract the component which should be used to
#  determine proxy routing.
#

raddb = raddb
modconfdir = ${raddb}/mods-config

security {
	allow_vulnerable_openssl = yes
	allow_core_dumps = yes
}

modules {
	always ok {
		rcode = ok
	}

	mschap {
		use_mppe = no

		attributes {
			username = User-Name
			chap_challenge = Vendor-Specific.Microsoft.CHAP-Challenge
			chap_response = Vendor-Specific.Microsoft.CHAP-Response
			chap2_response = Vendor-Specific.Microsoft.CHAP2-Response
			chap2_success = Vendor-Specific.Microsoft.CHAP2-Success
			chap_error = Vendor-Specific.Microsoft.CHAP-Error
			chap_mppe_keys = Vendor-Specific.Microsoft.CHAP-MPPE-Keys
			mppe_recv_key = Vendor-Specific.Microsoft.MPPE-Recv-Key
			mppe_send_key = Vendor-Specific.Microsoft.MPPE-Send-Key
			mppe_encryption_policy = Vendor-Specific.Microsoft.MPPE-Encryption-Policy
			mppe_encryption_types = Vendor-Specific.Microsoft.MPPE-Encryption-Types
			chap2_cpw = Vendor-Specific.Microsoft.CHAP2-CPW
			chap_nt_enc_pw = Vendor-Specific.Microsoft.CHAP-NT-Enc-PW
		}
	}

	eap fuzz-md5 {
		default_eap_type = md5
		require_identity_realm = no
		type = md5

		md5 {
		}
	}

	eap fuzz-md5-realm {
		default_eap_type = md5
		require_identity_realm = nai
		type = md5

		md5 {
		}
	}

	eap fuzz-gtc {
		default_eap_type = gtc
		require_identity_realm = no
		type = gtc

		gtc {
			auth_type = pap
		}
	}

	eap fuzz-mschapv2 {
		default_eap_type = mschapv2
		require_identity_realm = no
		type = mschapv2

		mschapv2 {
			auth_type = mschap
		}
	}

	eap fuzz-tls {
		default_eap_type = tls
		require_identity_realm = no
		type = tls

		tls-config fuzz-tls {
			chain {
				certificate_file = ${raddb}/certs/rsa/server.pem
				private_key_file = ${raddb}/certs/rsa/server.pem
				private_key_password = whatever
				ca_file = ${raddb}/certs/rsa/ca.pem
			}

			ca_file = ${raddb}/certs/rsa/ca.pem
			ca_path = ${raddb}/certs/rsa
			fragment_size = 1024
		}

		tls {
			tls = fuzz-tls
			require_client_cert = no
		}
	}

	eap fuzz-peap-ttls {
		default_eap_type = peap
		require_identity_realm = no
		type = peap
		type = ttls

		tls-config fuzz-tunnel {
			chain {
				certificate_file = ${raddb}/certs/rsa/server.pem
				private_key_file = ${raddb}/certs/rsa/server.pem
				private_key_password = whatever
				ca_file = ${raddb}/certs/rsa/ca.pem
			}

			ca_file = ${raddb}/certs/rsa/ca.pem
			ca_path = ${raddb}/certs/rsa
			fragment_size = 1024
		}

		peap {
			tls = fuzz-tunnel
			virtual_server = fuzz-inner
			require_client_cert = no
		}

		ttls {
			tls = fuzz-tunnel
			virtual_server = fuzz-inner
			require_client_cert = no
		}
	}
}

server fuzz-md5 {
	namespace = radius

	recv Access-Request {
		fuzz-md5
	}

	authenticate fuzz-md5 {
		fuzz-md5
	}
}

server fuzz-md5-realm {
	namespace = radius

	recv Access-Request {
		fuzz-md5-realm
	}

	authenticate fuzz-md5-realm {
		fuzz-md5-realm
	}
}

server fuzz-gtc {
	namespace = radius

	recv Access-Request {
		fuzz-gtc
	}

	authenticate fuzz-gtc {
		fuzz-gtc
	}

	authenticate pap {
		ok
	}
}

server fuzz-mschapv2 {
	namespace = radius

	recv Access-Request {
		fuzz-mschapv2
	}

	authenticate fuzz-mschapv2 {
		fuzz-mschapv2
	}

	authenticate mschap {
		mschap
	}
}

server fuzz-tls {
	namespace = radius

	recv Access-Request {
		fuzz-tls
	}

	authenticate fuzz-tls {
		fuzz-tls
	}
}

server fuzz-peap-ttls {
	namespace = radius

	recv Access-Request {
		fuzz-peap-ttls
	}

	authenticate fuzz-peap-ttls {
		fuzz-peap-ttls
	}
}

server fuzz-inner {
	namespace = radius

	recv Access-Request {
		ok
	}
}

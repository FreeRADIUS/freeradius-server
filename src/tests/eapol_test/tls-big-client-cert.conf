#
#   Run EAP-TLS with a client certificate of more than 65000 octets.
#   The certificate is larger than one TLS record.  Because the certificate
#   is also much larger than one EAP packet, the server reassembles many EAP
#   fragments into one buffer before OpenSSL reads the Certificate message.
#
#   `all.mk` runs `big_client_cert.sh` to create the certificate and the
#   private key.  The script signs the certificate with the test certificate
#   authority (CA) in `raddb/certs/rsa`.
#
#   eapol_test -c tls-big-client-cert.conf -s testing123
#
network={
	key_mgmt=WPA-EAP
	eap=TLS
	identity="user@example.org"
	ca_cert="raddb/certs/rsa/ca.pem"
	client_cert="build/tests/eapol_test/big_client_cert/client.pem"
	private_key="build/tests/eapol_test/big_client_cert/client.key"
}

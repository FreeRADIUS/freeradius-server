#
#   eapol_test -c fail-ttls-pap.conf -s testing123
#
#   A negative test.  The TLS handshake succeeds, and the inner PAP
#   authentication is then rejected, because the password is wrong.
#
#   That is the path which reaches eap_tls_fail(), which denies the TLS
#   session and runs the `clear session { ... }` section so that a session
#   whose inner authentication failed is not left in the cache.  No positive
#   test reaches it: the handshake has to succeed and the authentication has
#   to fail.
#
network={
	key_mgmt=WPA-EAP
	eap=TTLS
	identity="bob"
	anonymous_identity="anonymous@example.org"
	#ca_cert="raddb/certs/ca.pem"
	password="wrong-password"
	phase2="auth=PAP"
}

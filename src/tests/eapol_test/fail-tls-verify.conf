#
#   eapol_test -c fail-tls-verify.conf -s testing123
#
#   A negative test.  The TLS handshake itself fails, because the
#   `verify certificate { ... }` section rejects the client certificate.
#
#   The handshake failure reaches the `fail:` label of
#   `eap_tls_handshake_resume()` in `src/lib/eap/tls.c`.  That label
#   discards the TLS session, and discarding the session runs the
#   `clear session { ... }` section.  The `fail-ttls-pap.conf` test
#   reaches the failure through `eap_tls_fail()` instead, after a
#   handshake which succeeded.
#
network={
	key_mgmt=WPA-EAP
	eap=TLS
	identity="user@example.org"
	ca_cert="raddb/certs/rsa/ca.pem"
	client_cert="raddb/certs/rsa/client.crt"
	private_key="raddb/certs/rsa/client.key"
	private_key_passwd="whatever"

	phase1="tls_disable_session_ticket=0"
}

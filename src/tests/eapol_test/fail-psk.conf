#
#  EAP-PSK negative test: the supplicant uses the wrong pre-shared key,
#  so MAC_P verification fails and authentication must not succeed.
#
#  The `fail-` filename prefix tells the harness eapol_test is expected
#  to fail; the server must not crash. radiusd_stop verifies the daemon
#  is still alive at the end of the run.
#
network={
	key_mgmt=NONE
	eap=PSK

	identity="bob@example.org"

	#
	#  MD5("not-bob").  The server has MD5("bob") for this identity,
	#  so the peer's MAC_P will not verify.
	#
	password=c8f0c421452304cca60d9e2f6ab11006
}

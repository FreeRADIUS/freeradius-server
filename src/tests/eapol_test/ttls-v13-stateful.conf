#
#   TTLS with a stateful session ticket on TLS 1.3.  TTLS does not use stateless tickets, so a
#   stateful ticket is the only kind of ticket which TTLS can resume.  The server keeps the session in
#   a cache.  The first authentication is a full TTLS exchange, and the second authentication resumes
#   from the ticket.
#
#   eapol_test -c ttls-v13-stateful.conf -s testing123
#   EAPOL_TEST_OPTS: -r 1
#   EAPOL_TEST_EXPECT: Handshake finished - resumed=1
#
network={
	key_mgmt=WPA-EAP
	eap=TTLS
	identity="bob"
	anonymous_identity="anonymous@example.org"
	password="bob"
	phase2="auth=PAP"
	phase1="tls_disable_session_ticket=0 tls_disable_tlsv1_3=0"
}

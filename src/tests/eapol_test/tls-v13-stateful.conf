#
#   EAP-TLS with a stateful session ticket on TLS 1.3.  The server uses TLS 1.3 only, and keeps
#   the session in a cache.  The first authentication is a full EAP-TLS exchange, and the second
#   authentication resumes from the ticket.
#
#   eapol_test -c tls-v13-stateful.conf -s testing123
#   EAPOL_TEST_OPTS: -r 1
#   EAPOL_TEST_EXPECT: Handshake finished - resumed=1
#
network={
	key_mgmt=WPA-EAP
	eap=TLS
	identity="user@example.org"
	ca_cert="raddb/certs/rsa/ca.pem"
	client_cert="raddb/certs/rsa/client.crt"
	private_key="raddb/certs/rsa/client.key"
	private_key_passwd="whatever"
	phase1="tls_disable_session_ticket=0 tls_disable_tlsv1_3=0"
}

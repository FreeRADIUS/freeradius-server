#
#   PEAP with a stateful session ticket on TLS 1.3.  The server's minimum TLS version is 1.3, and the
#   server keeps the session in a cache.  The first authentication is a full PEAP exchange, and the
#   second authentication resumes from the ticket.
#
#   eapol_test -c peap-v13-stateful.conf -s testing123
#   EAPOL_TEST_OPTS: -r 1
#   EAPOL_TEST_EXPECT: Handshake finished - resumed=1
#
network={
	ssid="example"
	key_mgmt=WPA-EAP
	eap=PEAP
	identity="bob@example.org"
	anonymous_identity="anonymous@example.org"
	password="bob"
	phase2="auth=MSCHAPV2"
	phase1="peapver=0 tls_disable_session_ticket=0 tls_disable_tlsv1_3=0"
}

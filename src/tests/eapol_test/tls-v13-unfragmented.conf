#
#   EAP-TLS on TLS 1.3.  The server MUST NOT set the L bit in a message which
#   is not fragmented (RFC 9190 Section 2.1.9).  Its last message fits in one
#   packet, so the supplicant must see a TLS message with no flags set.
#
#   eapol_test -c tls-v13-unfragmented.conf -s testing123
#   EAPOL_TEST_EXPECT: SSL: Received packet(len=[1-9][0-9][0-9]*) - Flags 0x00
#
network={
	key_mgmt=WPA-EAP
	eap=TLS
	identity="user@example.org"
	ca_cert="raddb/certs/rsa/ca.pem"
	client_cert="raddb/certs/rsa/client.crt"
	private_key="raddb/certs/rsa/client.key"
	private_key_passwd="whatever"
	phase1="tls_disable_tlsv1_3=0"
}

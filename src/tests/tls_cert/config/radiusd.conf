#  -*- text -*-
#
#  test configuration file.  Do not install.
#
#  The eap modules use certificates outside of their validity period,
#  made by src/tests/tls_cert/certs.sh, and the server should say so
#  when it starts.
#
certdir		= $ENV{TLS_CERT_OUT}
raddb		= raddb

#  Only for testing!
#  Setting this on a production system is a BAD IDEA.
security {
	allow_vulnerable_openssl = yes
}

modules {
	#
	#  A certificate which has expired
	#
	eap eap_expired {
		default_eap_type = tls

		tls-config tls-common {
			private_key_file = ${certdir}/expired.key
			certificate_file = ${certdir}/expired.pem
			ca_file = ${certdir}/expired.pem
		}

		tls {
			tls = tls-common
		}
	}

	#
	#  A certificate which is not yet valid
	#
	eap eap_future {
		default_eap_type = tls

		tls-config tls-common {
			private_key_file = ${certdir}/future.key
			certificate_file = ${certdir}/future.pem
			ca_file = ${certdir}/future.pem
		}

		tls {
			tls = tls-common
		}
	}

	#
	#  A valid certificate, followed in the file by an expired one
	#
	eap eap_chain {
		default_eap_type = tls

		tls-config tls-common {
			private_key_file = ${certdir}/valid.key
			certificate_file = ${certdir}/chain.pem
			ca_file = ${certdir}/chain.pem
		}

		tls {
			tls = tls-common
		}
	}
}

client localhost {
	ipaddr = 127.0.0.1
	secret = testing123
}

server default {
	listen {
		type = auth
		ipaddr = 127.0.0.1
		port = 12355
	}

	authorize {
		eap_expired
		eap_future
		eap_chain
	}

	authenticate {
		eap_expired
		eap_future
		eap_chain
	}
}

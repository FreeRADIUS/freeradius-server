#  -*- text -*-
#
#  test configuration file.  Do not install.
#
#  Run with "-i 127.0.0.1 -p PORT".  Without "-n", the listeners use
#  the "default" virtual server.  With "-n other", which reads
#  other.conf, they use the "other" virtual server.
#
top_srcdir	= $ENV{TOP_SRCDIR}
run_dir		= ${top_srcdir}/$ENV{OUTPUT}
raddb		= raddb
pidfile		= ${run_dir}/radiusd.pid

client localhost {
	ipaddr = 127.0.0.1
	secret = testing123
}

#  Only for testing!
#  Setting this on a production system is a BAD IDEA.
security {
	allow_vulnerable_openssl = yes
}

modules {
	always ok {
		rcode = ok
	}
}

server default {
	authorize {
		update control {
			&Auth-Type := Accept
		}
		update reply {
			&Reply-Message := "default"
		}
	}

	authenticate {
	}

	preacct {
		ok
	}

	accounting {
		update reply {
			&Reply-Message := "default"
		}
		ok
	}
}

#
#  Used with "-n other".
#
server other {
	authorize {
		update control {
			&Auth-Type := Accept
		}
		update reply {
			&Reply-Message := "other"
		}
	}

	authenticate {
	}

	preacct {
		ok
	}

	accounting {
		update reply {
			&Reply-Message := "other"
		}
		ok
	}
}

#
#  Minimal proxy configuration for the TCP proxy tests.
#
#  run_test.py sets the environment variables TEST_DIR, TEST_PROXY_PORT, and
#  TEST_HOME_PORT.  The proxy
#  listens for UDP requests on TEST_PROXY_PORT, and proxies each request to a
#  home server which listens on TCP port TEST_HOME_PORT.
#
prefix = $ENV{TEST_DIR}
localstatedir = ${prefix}
logdir = ${prefix}
run_dir = ${prefix}
db_dir = ${prefix}
radacctdir = ${prefix}
pidfile = ${run_dir}/radiusd.pid

proxy_requests = yes
max_request_time = 30
cleanup_delay = 2

security {
	allow_vulnerable_openssl = yes
}

thread pool {
	start_servers = 2
	max_servers = 4
}

client localhost {
	ipaddr = 127.0.0.1
	secret = testing123
	proto = *
	require_message_authenticator = no
}

home_server home {
	type = auth
	ipaddr = 127.0.0.1
	port = $ENV{TEST_HOME_PORT}
	proto = tcp
	secret = testing123
	response_window = 20
	status_check = none
	require_message_authenticator = no
}

home_server_pool pool {
	type = fail-over
	home_server = home
}

realm DEFAULT {
	auth_pool = pool
	nostrip
}

listen {
	type = auth
	ipaddr = 127.0.0.1
	port = $ENV{TEST_PROXY_PORT}
	virtual_server = default
}

server default {
	authorize {
		update control {
			Proxy-To-Realm := DEFAULT
		}
	}
}

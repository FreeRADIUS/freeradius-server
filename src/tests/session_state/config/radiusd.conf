#  -*- text -*-
#
#  test configuration file.  Do not install.
#
#  Every Access-Request gets an Access-Challenge, and saves an
#  attribute in session-state.  The client never answers the
#  challenge, so the session is still pending when the server exits.
#
top_srcdir	= $ENV{TOP_SRCDIR}
run_dir		= ${top_srcdir}/$ENV{OUTPUT}
raddb		= raddb
pidfile		= ${run_dir}/radiusd.pid

client localhost {
	ipaddr = 127.0.0.1
	secret = testing123
}

#  Only for testing!
#  Setting this on a production system is a BAD IDEA.
security {
	allow_vulnerable_openssl = yes
}

server default {
	authorize {
		update session-state {
			&Tmp-String-0 := "pending"
		}
		update control {
			&Auth-Type := Accept
			&Response-Packet-Type := Access-Challenge
		}
	}

	authenticate {
	}
}

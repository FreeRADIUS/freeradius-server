# -*- text -*-
#
#  $Id$

#
#  Configuration file for the "redis" module.  This module does nothing
#  Other than provide connections to a redis database, and a %redis(' ...')
#  expansion.
#
redis {
	#  Host where the redis server is located.
	#  We recommend using ONLY 127.0.0.1 !
	server = $ENV{REDIS_TEST_SERVER}:$ENV{REDIS_CLUSTER_PORT_1}
	server = $ENV{REDIS_TEST_SERVER}:$ENV{REDIS_CLUSTER_PORT_2}
	server = $ENV{REDIS_TEST_SERVER}:$ENV{REDIS_CLUSTER_PORT_3}
	server = $ENV{REDIS_TEST_SERVER}:$ENV{REDIS_CLUSTER_PORT_4}
	server = $ENV{REDIS_TEST_SERVER}:$ENV{REDIS_CLUSTER_PORT_5}
	server = $ENV{REDIS_TEST_SERVER}:$ENV{REDIS_CLUSTER_PORT_6}

	#  The password used to authenticate to the server.
	#  We recommend using a strong password.
#	password = thisisreallysecretandhardtoguess

	virtual_server = redis

	lua {
		function hello_world {
			body = 'return "hello world"'
		}

		function concat_args_keys {
			body = "return table.concat(KEYS, ',') .. ',' .. table.concat(ARGV, ',')"
		}

		function multiline {
			body = "if ARGV[1] == '0' then\
					return 0\
				else\
					return 1\
				end"
		}

		#
		#  Lua doesn't have a built in sleep, and the typical tricks of using the "os"
		#  library don't appear to work in the interpreter built into Redis.
		#  So, this takes long enough that we can timeout in policy.
		#
		function slow {
			body = 'local z = 0 for i=1,200000000 do z = z * i z = z / i end return z'
		}
	}

	pool {
		#  Connections to create during module instantiation.
		#  If the server cannot create specified number of
		#  connections during instantiation it will exit.
		#  Set to 0 to allow the server to start without the
		#  web service being available.
		start = 0

		#  Minimum number of connections to keep open
		min = 0

		#  Maximum number of connections
		#
		#  If these connections are all in use and a new one
		#  is requested, the request will NOT get a connection.
		#
		#  Setting 'max' to LESS than the number of threads means
		#  that some threads may starve, and you will see errors
		#  like 'No connections available and at max connection limit'
		#
		#  Setting 'max' to MORE than the number of threads means
		#  that there are more connections than necessary.
		max = 12

		#  Number of uses before the connection is closed
		#
		#  0 means "infinite"
		uses = 0

		#  The lifetime (in seconds) of the connection
		#
		#  NOTE: A setting of 0 means infinite (no limit).
		lifetime = 86400

		#  The idle timeout (in seconds).  A connection which is
		#  unused for this length of time will be closed.
		#
		#  NOTE: A setting of 0 means infinite (no timeout).
		idle_timeout = 600
	}
}

delay {
}


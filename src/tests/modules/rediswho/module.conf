# -*- text -*-
#
#  $Id$

rediswho {

	trim_count = 2

	expiry_time = 30

	key = User-Name
	value = "%l,%{Acct-Session-Id},%{NAS-IP-Address || NAS-IPv6-Address},%{Acct-Session-Time},%{Framed-IP-Address},%{Acct-Input-Gigawords || 0},%{Acct-Output-Gigawords || 0},%{Acct-Input-Octets || 0},%{Acct-Output-Octets || 0}"

	start {
		key = ${..key}
		insert_arg = ${..value}
	}

	interim-update {
		key = ${..key}
		insert_arg = ${..value}
	}

	redis {
		server = $ENV{REDISWHO_TEST_SERVER}:$ENV{REDIS_CLUSTER_PORT_1}

		virtual_server = redis

		pool {
			start = 0
			min = 0
			max = 12
			uses = 0
			lifetime = 86400

			connection {
				connection_timeout = 3.0
				reconnect_delay = 5
			}
			request {
				per_connection_max = 2000
				per_connection_target = 1000
				free_delay = 10
			}
		}
	}
}

redis = ${modules.rediswho.redis}

delay {
}

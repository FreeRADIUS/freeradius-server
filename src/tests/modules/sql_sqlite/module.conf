sql {
	driver = "rlm_sql_sqlite"
	dialect = "sqlite"
	sqlite {
		# Path to the sqlite database
		filename = "$ENV{MODULE_TEST_DIR}/sql_sqlite/rlm_sql_sqlite.db"

		# If the file above does not exist and bootstrap is set
		# a new database file will be created, and the SQL statements
		# contained within the file will be executed.
		bootstrap = "${modconfdir}/${..:name}/main/${..dialect}/schema.sql"
	}
	radius_db = "radius"

	acct_table1 = "radacct"
	acct_table2 = "radacct"
	postauth_table = "radpostauth"
	authcheck_table = "radcheck"
	groupcheck_table = "radgroupcheck"
	authreply_table = "radreply"
	groupreply_table = "radgroupreply"
	usergroup_table = "radusergroup"
	read_groups = yes
	read_profiles = yes

	# Remove stale session if checkrad does not see a double login
	delete_stale_sessions = yes

	pool {
		start = 1
		min = 0
		max = 1
		spare = 3
		uses = 2
		lifetime = 1
		idle_timeout = 60
		retry_delay = 1
	}

	# Set to 'yes' to read radius clients from the database ('nas' table)
	# Clients will ONLY be read on server startup.
#	read_clients = yes

	# Table to keep radius client info
	client_table = "nas"

	# The group attribute specific to this instance of rlm_sql
	group_attribute = "SQL-Group"

	record_query_number = yes

	# Read database-specific queries
	$INCLUDE ${modconfdir}/${.:name}/main/${dialect}/queries.conf
}

#
#  A separate database for the sqlippool tests
#
sql sql_ippool {
	driver = "rlm_sql_sqlite"
	dialect = "sqlite"
	sqlite {
		filename = "$ENV{MODULE_TEST_DIR}/sql_sqlite/rlm_sql_sqlite_ippool.db"
		bootstrap = "${modconfdir}/sql/ippool/sqlite/schema.sql"
	}
	radius_db = "radius"
}

sqlippool {
	sql_module_instance = "sql_ippool"
	dialect = "sqlite"
	ippool_table = "radippool"
	lease_duration = 3600
	pool_name = "Pool-Name"
	attribute_name = Framed-IP-Address
	req_attribute_name = Framed-IP-Address
	pool_key = "%{NAS-Port}"

	$INCLUDE ${modconfdir}/sql/ippool/${dialect}/queries.conf
}

#
#  For the reconnect test: one connection, which is replaced only when
#  a query fails.  It comes after "sql", so that ${modules.sql...}
#  still refers to "sql".
#
sql sql_reconnect {
	driver = "rlm_sql_sqlite"
	dialect = "sqlite"
	sqlite {
		filename = "$ENV{MODULE_TEST_DIR}/sql_sqlite/reconnect/rlm_sql_sqlite.db"
		bootstrap = "${modconfdir}/sql/main/sqlite/schema.sql"
	}
	radius_db = "radius"

	pool {
		start = 1
		min = 1
		max = 1
		spare = 0
		uses = 0
		lifetime = 0
		idle_timeout = 0
		retry_delay = 1
	}
}

#
#  For the idle_timeout test: two pools with one connection each, and
#  "idle_timeout = 1".  sql_idle closes its connection when it has been
#  idle for longer than that and is next needed; sql_idle_reuse
#  re-uses it, which is the default.
#
sql sql_idle {
	driver = "rlm_sql_sqlite"
	dialect = "sqlite"
	sqlite {
		filename = "$ENV{MODULE_TEST_DIR}/sql_sqlite/idle_timeout/rlm_sql_sqlite.db"
		bootstrap = "${modconfdir}/sql/main/sqlite/schema.sql"
	}
	radius_db = "radius"

	pool {
		start = 1
		min = 1
		max = 1
		spare = 0
		uses = 0
		lifetime = 0
		cleanup_interval = 1
		idle_timeout = 1
		strict_idle_timeout = yes
		retry_delay = 1
	}
}

sql sql_idle_reuse {
	driver = "rlm_sql_sqlite"
	dialect = "sqlite"
	sqlite {
		filename = "$ENV{MODULE_TEST_DIR}/sql_sqlite/idle_reuse/rlm_sql_sqlite.db"
		bootstrap = "${modconfdir}/sql/main/sqlite/schema.sql"
	}
	radius_db = "radius"

	pool {
		start = 1
		min = 1
		max = 1
		spare = 0
		uses = 0
		lifetime = 0
		cleanup_interval = 1
		idle_timeout = 1
		retry_delay = 1
	}
}

#
#  Waits for longer than the "idle_timeout" of sql_idle and
#  sql_idle_reuse.
#
exec idle_wait {
	wait = yes
	program = "/bin/sleep 2"
}

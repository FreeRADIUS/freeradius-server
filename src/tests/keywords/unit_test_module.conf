#
#  Minimal radiusd.conf for testing keywords
#

raddb		= raddb
tmp		= $ENV{OUTPUT}
keyword		= src/tests/keywords

modconfdir	= ${raddb}/mods-config

#  Only for testing!
#  Setting this on a production system is a BAD IDEA.
security {
	allow_vulnerable_openssl = yes
	allow_core_dumps = yes

	#
	#  See the "filename" and "filename-limits" tests.
	#
	limit {
		files {
			# $(BUILD_DIR)/tests/keywords
			allow = "${tmp}"

			# raddb/
			read = "${raddb}"
		}

		#
		#  See the "exec-limit" test.
		#
		exec {
			#
			#  A prefix of "/bin/echo" which does not end at a
			#  directory boundary.  It must not match, and it
			#  must not stop the search either: the entry below
			#  it does match.
			#
			allow = "/bin/e"

			#  xlat-exec, exec-list, exec-unsafe, exec-limit
			allow = "/bin/echo"

			#  exec-list, exec-loop
			allow = "/bin/sh"
		}
	}
}

$INCLUDE ./$ENV{PROTOCOL}.conf

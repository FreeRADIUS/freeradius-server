#  -*- text -*-
#
#  Test configuration file.  Do not install.
#
#  unit_test_tls.conf with `buffer_size = 2048` on both roles, and a server
#  certificate of about 64K.  `big_cert.sh` creates the certificate and the
#  private key in the output directory.  `big_cert.sh` passes the two paths in
#  `BIG_CERT` and `BIG_KEY`.
#
#  `buffer_size` sets the size of the clean record buffers.  The buffer that
#  holds the octets read from the peer (`dirty_in`) is never smaller than one
#  maximum-size TLS record.  See `tls_session_set_buffer_sizes()` in
#  `src/lib/tls/session.c`.  Because the server's Certificate message is about
#  four TLS records long, the client has to pass the message to OpenSSL one
#  record at a time.
#
#  `tls_min_version` and `tls_max_version` read the `TLS_VERSION` environment
#  variable.  `big_cert.sh` sets `TLS_VERSION` to run the same configuration
#  with TLS 1.2 and with TLS 1.3.
#
#  $Id$
#

$INCLUDE common.conf

unit_test_tls {
	transport = tcp

	tcp {
		ipaddr = 127.0.0.1
		port = $ENV{PORT}
	}
	require_client_certificate = yes

	server {
		virtual_server = tls

		chain {
			certificate_file = $ENV{BIG_CERT}
			private_key_file = $ENV{BIG_KEY}

			ca_file = ${cadir}/rsa/ca.pem
		}

		ca_file = ${cadir}/rsa/ca.pem
		ca_path = ${cadir}

		buffer_size = 2048

		cipher_list = "DEFAULT"
		cipher_server_preference = yes

		tls_min_version = $ENV{TLS_VERSION}
		tls_max_version = $ENV{TLS_VERSION}

		session {
			mode = disabled
		}

		verify {
			attribute_mode = client-and-issuer
		}
	}

	client {
		virtual_server = tls-client

		buffer_size = 2048

		tls_min_version = $ENV{TLS_VERSION}
		tls_max_version = $ENV{TLS_VERSION}

		session {
			mode = disabled
		}

		verify {
			attribute_mode = client-and-issuer
		}

		chain {
			certificate_file = ${certdir}/rsa/client.pem

			private_key_password = whatever
			private_key_file = ${certdir}/rsa/client.key

			ca_file = ${cadir}/rsa/ca.pem
		}

		ca_file = ${cadir}/rsa/ca.pem
		ca_path = ${cadir}

		cipher_list = "DEFAULT"
	}
}

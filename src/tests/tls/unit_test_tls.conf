#  -*- text -*-
#
#  Test configuration file.  Do not install.
#
#  Configuration for unit_test_tls.  The program opens a listening TCP
#  socket, accepts one connection, and runs the TLS handshake for that
#  connection to completion.
#
#  $Id$
#

raddb		= raddb
certdir		= ${raddb}/certs
cadir		= ${raddb}/certs
modconfdir	= ${raddb}/mods-config
logdir		= build/tests/tls/

#  Only for testing!
#  Setting this on a production system is a BAD IDEA.
security {
	allow_vulnerable_openssl = yes
	allow_core_dumps = yes
}

#
#  A bare return code such as `ok` needs a `modules` section to exist, even
#  when the configuration calls no module.
#
modules {
	$INCLUDE ${raddb}/mods-available/always

	#
	#  The store for the server's sessions.  A server is handed a session
	#  ID by the peer, so the ID is the key.
	#
	cache cache_tls_session {
		driver = "rbtree"
		key = %{Session-Id}
		ttl = 3600

		update {
			reply.Session-Data := Session-Data
		}
	}

	#
	#  The store for the client's sessions.  A client picks a session
	#  before it has an ID to pick it by, so the key is a constant: this
	#  program talks to one server.  A real client would key on whatever
	#  identifies the server it is about to connect to.
	#
	cache cache_tls_client_session {
		driver = "rbtree"
		key = "unit_test_tls"
		ttl = 3600

		update {
			reply.Session-Data := Session-Data
		}
	}
}

#
#  The settings which belong to the test program, and to nothing else.
#
#  Keeping them here rather than in the `tls` section below means the `tls`
#  section holds nothing but TLS configuration, and can be copied to or from
#  any other place in the server which configures TLS.
#
unit_test_tls {
	#
	#  The address of the listening socket.
	#
	ipaddr = 127.0.0.1
	port = 2083

	#
	#  Whether the connecting client has to present a certificate.
	#
	#  Setting `require_client_certificate` to `yes` is what runs the
	#  `verify certificate` section of the `tls` virtual server.  The
	#  connecting client then has to present a certificate, for example:
	#
	#  openssl s_client -connect 127.0.0.1:2083 \
	#            -cert raddb/certs/rsa/client.pem \
	#            -key raddb/certs/rsa/client.key -pass pass:whatever \
	#            -CAfile raddb/certs/rsa/ca.pem
	#
	require_client_certificate = yes
}

#
#  The TLS configuration.
#
#  This is a top-level section rather than one inside a `listen` section.  A
#  `listen` section has to name a transport and load a matching `proto_` module,
#  and there is no `proto_tls` in the source (as of yet)
#
#  Every item here is parsed by fr_tls_conf_parse_server(), so this section
#  takes the same items as the TLS configuration anywhere else in the server,
#  and nothing more.
#
tls {
	#
	#  The virtual server holding the sections which the handshake calls.
	#
	virtual_server = tls

	chain {
		certificate_file = ${certdir}/rsa/server.pem

		private_key_password = whatever
		private_key_file = ${certdir}/rsa/server.pem

		ca_file = ${cadir}/rsa/ca.pem
	}

	ca_file = ${cadir}/rsa/ca.pem
	ca_path = ${cadir}

	fragment_size = 8192

	cipher_list = "DEFAULT"
	cipher_server_preference = yes

	#
	#  Session resumption is disabled, so the `load session`,
	#  `store session` and `clear session` sections are compiled but never
	#  called.
	#
	#  To enable session resumption, set `name` in this section, and point
	#  those three sections at a cache module.
	#
	#
	#  Stateful resumption is only defined below TLS 1.3, see
	#  src/lib/tls/conf.c and tls_cache_store_cb() in src/lib/tls/cache.c.
	#
	tls_max_version = 1.2

	session {
		mode = stateful
		name = "unit_test_tls server"
	}

	verify {
		attribute_mode = client-and-issuer
	}
}

#
#  The configuration used by `-s server[:port]`, which turns the
#  program around: instead of listening for a connection from a
#  client, it makes a connection to a server.
#
tls client {
	#
	#  Naming a virtual server is what makes a client run policy.  Without
	#  it, OpenSSL validates the server certificate on its own and no
	#  section runs.  With it, the `verify certificate` section below runs
	#  against the server's certificate, exactly as it does on the server
	#  side against the client's.
	#
	#
	#  A separate virtual server from the one the server role uses, so
	#  that each can key its cache its own way.
	#
	virtual_server = tls-client

	tls_max_version = 1.2

	session {
		mode = stateful
		name = "unit_test_tls client"
	}

	verify {
		attribute_mode = client-and-issuer
	}

	chain {
		certificate_file = ${certdir}/rsa/client.pem

		private_key_password = whatever
		private_key_file = ${certdir}/rsa/client.key

		ca_file = ${cadir}/rsa/ca.pem
	}

	ca_file = ${cadir}/rsa/ca.pem
	ca_path = ${cadir}

	cipher_list = "DEFAULT"
}

#
#  The virtual server for the server role.
#
server tls {
	namespace = tls

	#
	#  The TLS code calls the `verify certificate` section once OpenSSL
	#  has verified the peer's certificate chain.  The certificate
	#  attributes are in the session-state list.
	#
	#  Returning ok, updated or noop lets the handshake continue.  Any
	#  other return code fails the handshake.
	#
	verify certificate {
		if (!parent.session-state.TLS-Certificate[0].Issuer) {
			reject
		}

		ok
	}

	#
	#  Called before the handshake starts.
	#
	new session {
		ok
	}

	#
	#  Called once the handshake has finished.
	#
	establish session {
		ok
	}

	#
	#  Session resumption.  The peer offers a session ID, and
	#  `load session` is asked whether there is a session to go with it.
	#  `Session-Data` in the reply is the stored session.
	#
	load session {
		control.Cache-Allow-Insert := no

		cache_tls_session
	}

	store session {
		control.Cache-TTL := Session-TTL

		cache_tls_session
	}

	clear session {
		control.Cache-Allow-Insert := no
		control.Cache-Allow-Merge := no
		control.Cache-TTL := 0

		cache_tls_session
	}

	#
	#  Runs when the TLS session fails, independently of whether
	#  anything was cached.  The reject test (-R) reaches it.
	#
	fail session {
		ok
	}
}

#
#  The virtual server for the client role.
#
#  The sections are the same ones, called at the same points.  The difference
#  is the cache module they use, because a client keys its store differently.
#
server tls-client {
	namespace = tls

	verify certificate {
		if (!parent.session-state.TLS-Certificate[0].Issuer) {
			reject
		}

		ok
	}

	new session {
		ok
	}

	establish session {
		ok
	}

	load session {
		control.Cache-Allow-Insert := no

		cache_tls_client_session
	}

	store session {
		cache_tls_client_session
	}

	clear session {
		control.Cache-Allow-Insert := no
		control.Cache-Allow-Merge := no
		control.Cache-TTL := 0

		cache_tls_client_session
	}
}

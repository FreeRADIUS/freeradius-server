#  -*- text -*-
#
#  Test configuration file.  Do not install.
#
#  unit_test_tls.conf with a virtual server that has no `verify certificate`
#  section, on both roles.
#
#  The TLS code still has to decode the peer's chain into
#  `session-state.TLS-Certificate` pairs, because `attribute_mode` asks for
#  them.  The decode runs on the main stack, after the verify callback has
#  paused the handshake, see fr_tls_verify_cert_cb() in src/lib/tls/verify.c.
#  With no section to run, the handshake resumes as soon as the decode is
#  done.  No other test reaches that path, every other virtual server in this
#  directory has a `verify certificate` section.
#
#  $Id$
#

$INCLUDE common.conf

#
#  The virtual server for both roles.  It has every section the `tls`
#  virtual server in common.conf has, except `verify certificate` and
#  `load psk`.  Session caching is off, so the cache sections compile and
#  never run.
#
server tls-no-verify {
	namespace = tls

	new session {
		ok
	}

	establish session {
		ok
	}

	encode session {
		ok
	}

	decode session {
		ok
	}

	load session {
		ok
	}

	store session {
		ok
	}

	clear session {
		ok
	}

	fail session {
		ok
	}
}

#
#  This section holds the settings for the test program, with the TLS
#  configuration for each role as a subsection.
#
#  `ipaddr` and `port` give the listening socket, and the default port for
#  `-s`.  `require_client_certificate` makes the server ask the client for a
#  certificate, so the server decodes a chain too.  `common.conf` has the
#  client command that presents a certificate.
#
#  The TLS library's own rules parse the `server` and `client` subsections.
#  Each subsection therefore takes exactly the items that a `tls { ... }`
#  section takes anywhere else in the server, and nothing more.
#
unit_test_tls {
	ipaddr = 127.0.0.1
	port = $ENV{PORT}
	require_client_certificate = yes

	server {
		virtual_server = tls-no-verify

		chain {
			certificate_file = ${certdir}/rsa/server.pem

			private_key_password = whatever
			private_key_file = ${certdir}/rsa/server.pem

			ca_file = ${cadir}/rsa/ca.pem
		}

		ca_file = ${cadir}/rsa/ca.pem
		ca_path = ${cadir}

		fragment_size = 8192

		cipher_list = "DEFAULT"
		cipher_server_preference = yes

		tls_max_version = 1.2

		session {
			mode = disabled
		}

		#
		#  Decode the peer's certificate and its issuer, so two
		#  `TLS-Certificate` pairs per connection.
		#
		verify {
			attribute_mode = client-and-issuer
		}
	}

	#
	#  The configuration used by `-s server[:port]`, which turns the
	#  program around: instead of listening for a connection from a
	#  client, it makes a connection to a server.
	#
	client {
		virtual_server = tls-no-verify

		tls_max_version = 1.2

		session {
			mode = disabled
		}

		verify {
			attribute_mode = client-and-issuer
		}

		chain {
			certificate_file = ${certdir}/rsa/client.pem

			private_key_password = whatever
			private_key_file = ${certdir}/rsa/client.key

			ca_file = ${cadir}/rsa/ca.pem
		}

		ca_file = ${cadir}/rsa/ca.pem
		ca_path = ${cadir}

		cipher_list = "DEFAULT"
	}
}

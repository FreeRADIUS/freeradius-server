#  -*- text -*-
#
#  Test configuration file.  Do not install.
#
#  This file configures a `radius` module in `mode = dynamic-proxy`.  The
#  module opens a Datagram Transport Layer Security (DTLS) connection to the
#  destination that the `%home.sendto.ipaddr()` expansion names.  Unlike
#  `rlm_radius_dtls.conf`, the module does not connect when the server
#  starts.  The module connects when a request runs the expansion.
#
#  `rlm_radius_dtls_dynamic.sh` runs unit_test_tls as the home server, then
#  runs radiusd with this file.  The script sets two environment variables:
#
#	PORT	the UDP port of the home server, the DTLS destination
#	LPORT	the TCP port where radiusd receives the Access-Request.  The
#		number is the same as PORT, because UDP and TCP ports are
#		separate.
#
#  $Id$
#

raddb		= raddb
certdir		= ${raddb}/certs
cadir		= ${raddb}/certs
modconfdir	= ${raddb}/mods-config
logdir		= build/tests/tls/

#  Only for testing!
#  Do not set `allow_vulnerable_openssl` or `allow_core_dumps` on a
#  production system.
security {
	allow_vulnerable_openssl = yes
	allow_core_dumps = yes
}

modules {
	radius home {
		mode = dynamic-proxy
		transport = udp
		type = Access-Request

		#
		#  The module has no destination when the server starts.  The module
		#  allocates a trunk (the set of connections to one destination) for
		#  each destination, and the trunk opens the first connection when a
		#  request arrives.
		#
		pool {
			start = 0
			min = 1
			max = 8
			connecting = 1
		}

		udp {
			src_ipaddr = 127.0.0.1

			#
			#  The destination and the secret come from the expansion.
			#  The same `tls` subsection applies to every destination.
			#
			tls {
				chain {
					certificate_file = ${certdir}/rsa/client.pem

					private_key_password = whatever
					private_key_file = ${certdir}/rsa/client.key

					ca_file = ${cadir}/rsa/ca.pem
				}

				ca_file = ${cadir}/rsa/ca.pem
				ca_path = ${cadir}

				tls_max_version = 1.2
			}
		}
	}
}

client testclient {
	ipaddr = 127.0.0.1
	secret = testing123
	proto = tcp
}

server default {
	namespace = radius

	listen {
		type = Access-Request
		transport = tcp

		tcp {
			ipaddr = 127.0.0.1
			port = $ENV{LPORT}
		}
	}

	#
	#  The expansion makes the `radius` module open the DTLS connection to
	#  the destination.  Because the home server does not handle RADIUS
	#  packets, the request never completes.  The test stops radiusd once
	#  the connection is open.
	#
	recv Access-Request {
		reply.NAS-Port := %home.sendto.ipaddr(127.0.0.1, $ENV{PORT}, 'radius/dtls')
	}
}

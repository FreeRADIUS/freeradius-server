#  -*- text -*-
#
#  Test configuration file.  Do not install.
#
#  rlm_radius_blocked.py runs radiusd with this file.  The `radius` module proxies
#  Access-Request packets over RADIUS/TCP to the home server, which is
#  rlm_radius_blocked_server.py.  The server stops reading, so the TCP
#  connection blocks on write.
#
#  The environment gives the two ports:
#
#	PORT	the port of the home server
#	LPORT	the UDP port where radiusd receives Access-Request packets
#
#  $Id$
#

raddb		= raddb
certdir		= ${raddb}/certs
cadir		= ${raddb}/certs
modconfdir	= ${raddb}/mods-config
logdir		= build/tests/tls/

#  Only for testing!
#  Setting this on a production system is a BAD IDEA.
security {
	allow_vulnerable_openssl = yes
	allow_core_dumps = yes
}

modules {
	radius home {
		mode = proxy
		transport = tcp
		type = Access-Request

		tcp {
			ipaddr = 127.0.0.1
			port = $ENV{PORT}

			#
			#  The home server does not speak RADIUS, so the value does not matter.
			#
			secret = testing123

			#
			#  A small send buffer, so that the connection blocks after
			#  a few packets.
			#
			send_buff = 4096
		}
	}
}

client testclient {
	ipaddr = 127.0.0.1
	secret = testing123
	proto = udp
}

server default {
	namespace = radius

	listen {
		type = Access-Request
		transport = udp

		udp {
			ipaddr = 127.0.0.1
			port = $ENV{LPORT}
		}
	}

	recv Access-Request {
		control.Auth-Type := ::proxy
	}

	authenticate proxy {
		home
	}
}

#  -*- text -*-
#
#  Test configuration file.  Do not install.
#
#  The smallest radiusd configuration that makes the `radius` module open a
#  Datagram Transport Layer Security (DTLS) connection.  Because the `radius`
#  module starts one connection when the server starts, no packet needs to
#  arrive.
#
#  `rlm_radius_dtls.sh` runs unit_test_tls as the home server, then runs
#  radiusd with this file.  As in `dtls.conf`, the port of the home server
#  comes from `PORT` in the environment.
#
#  $Id$
#

raddb		= raddb
certdir		= ${raddb}/certs
cadir		= ${raddb}/certs
modconfdir	= ${raddb}/mods-config
logdir		= build/tests/tls/

#  Only for testing!
#  Setting this on a production system is a BAD IDEA.
security {
	allow_vulnerable_openssl = yes
	allow_core_dumps = yes
}

modules {
	radius home {
		mode = client
		transport = udp
		type = Access-Request

		udp {
			ipaddr = 127.0.0.1
			port = $ENV{PORT}

			#
			#  The secret is optional when the `tls` subsection is present, and defaults
			#  to `radius/dtls` (RFC 7360 section 2.1).
			#
			tls {
				chain {
					certificate_file = ${certdir}/rsa/client.pem

					private_key_password = whatever
					private_key_file = ${certdir}/rsa/client.key

					ca_file = ${cadir}/rsa/ca.pem
				}

				ca_file = ${cadir}/rsa/ca.pem
				ca_path = ${cadir}

				tls_max_version = 1.2
			}
		}
	}
}

server default {
	namespace = radius

	recv Access-Request {
		home
	}
}

#
#  radiusd refuses to start without a listener.  A control socket needs no
#  port, so the test does not take a second port from the allocator.
#  The socket is in the test output directory.
#
server control-socket-server {
	namespace = control

	listen {
		transport = unix

		unix {
			filename = $ENV{OUTPUT}/rlm_radius_dtls.sock
			mode = rw

			peercred {
			}
		}
	}
}

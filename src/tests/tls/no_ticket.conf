#  -*- text -*-
#
#  Test configuration file.  Do not install.
#
#  A server which issues no session tickets, talking to a client which expects
#  one.  The pair exists to pin one thing: a client stops waiting when
#  application data arrives.
#
#  `mode = disabled` on the server sets SSL_OP_NO_TICKET and zero tickets, so
#  nothing is ever sent for the client to keep.  The client stays
#  `mode = stateless`, so fr_tls_session_is_init_finished() holds it open
#  waiting for a ticket which is never coming.
#
#  The only thing which can release it is the byte of application data the
#  server sends once the handshake is done, because a server sends every
#  ticket it is going to send before its first byte of application data.
#  stateless.conf cannot pin that: there the ticket arrives first and settles
#  the question before the byte is read.
#
#  Without the application-data signal the client waits for the post-handshake
#  timer in src/bin/unit_test_tls.c and then fails, which is what makes this
#  configuration a test rather than a demonstration.
#
#  tls_max_version is left unset, because session tickets are a TLS 1.3
#  feature and the other configurations pin the version to 1.2.
#
#  $Id$
#

$INCLUDE common.conf



#
#  This section holds the settings for the test program, with the TLS
#  configuration for each role as a subsection.
#
#  `ipaddr` and `port` give the listening socket, and the default port for
#  `-s`.  `require_client_certificate` makes the server ask the client for a
#  certificate.  Asking for a certificate is what runs the `verify certificate`
#  section of the `tls` virtual server.  `common.conf` has the client command
#  that presents a certificate.
#
#  The TLS library's own rules parse the `server` and `client` subsections.
#  Each subsection therefore takes exactly the items that a `tls { ... }`
#  section takes anywhere else in the server, and nothing more.
#
unit_test_tls {
	ipaddr = 127.0.0.1
	port = 2083
	require_client_certificate = yes

	server {
		#
		#  The virtual server holding the sections which the handshake calls.
		#
		virtual_server = tls

		chain {
			certificate_file = ${certdir}/rsa/server.pem

			private_key_password = whatever
			private_key_file = ${certdir}/rsa/server.pem

			ca_file = ${cadir}/rsa/ca.pem
		}

		ca_file = ${cadir}/rsa/ca.pem
		ca_path = ${cadir}

		fragment_size = 8192

		cipher_list = "DEFAULT"
		cipher_server_preference = yes

		#
		#  Session resumption is disabled, so the `load session`,
		#  `store session` and `clear session` sections are compiled but never
		#  called.
		#
		#  To enable session resumption, set `name` in this section, and point
		#  those three sections at a cache module.
		#
		#
		#  Stateful resumption is only defined below TLS 1.3, see
		#  src/lib/tls/conf.c and tls_cache_store_cb() in src/lib/tls/cache.c.
		#

		session {
			mode = disabled
		}

		verify {
			attribute_mode = client-and-issuer
		}
	}

	#
	#  The configuration used by `-s server[:port]`, which turns the
	#  program around: instead of listening for a connection from a
	#  client, it makes a connection to a server.
	#
	client {
		#
		#  Naming a virtual server is what makes a client run policy.  Without
		#  it, OpenSSL validates the server certificate on its own and no
		#  section runs.  With it, the `verify certificate` section below runs
		#  against the server's certificate, exactly as it does on the server
		#  side against the client's.
		#
		#
		#  A separate virtual server from the one the server role uses, so
		#  that each can key its cache its own way.
		#
		virtual_server = tls-client


		session {
			mode = stateless
			name = "unit_test_tls client"
		}

		verify {
			attribute_mode = client-and-issuer
		}

		chain {
			certificate_file = ${certdir}/rsa/client.pem

			private_key_password = whatever
			private_key_file = ${certdir}/rsa/client.key

			ca_file = ${cadir}/rsa/ca.pem
		}

		ca_file = ${cadir}/rsa/ca.pem
		ca_path = ${cadir}

		cipher_list = "DEFAULT"
	}
}

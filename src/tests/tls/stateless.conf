#  -*- text -*-
#
#  Test configuration file.  Do not install.
#
#  unit_test_tls.conf with stateless session resumption instead of stateful.
#
#  A stateless session is carried in a ticket the peer holds, not in a cache
#  this end keeps, so `load session` and `store session` never run.  What runs
#  instead is `encode session` before the session-state list is written into a
#  ticket, and `decode session` once a presented ticket has put that list back.
#  Both sections are in common.conf, and this is the only configuration which
#  reaches them.
#
#  tls_max_version is left unset, because stateless resumption here is a TLS
#  1.3 feature and the other configurations pin the version to 1.2.
#
#  $Id$
#

$INCLUDE common.conf


#
#  The TLS configuration.
#
#  This is a top-level section rather than one inside a `listen` section.  A
#  `listen` section has to name a transport and load a matching `proto_` module,
#  and there is no `proto_tls` in the source (as of yet)
#
#  Every item here is parsed by fr_tls_conf_parse_server(), so this section
#  takes the same items as the TLS configuration anywhere else in the server,
#  and nothing more.
#
tls {
	#
	#  The virtual server holding the sections which the handshake calls.
	#
	virtual_server = tls

	chain {
		certificate_file = ${certdir}/rsa/server.pem

		private_key_password = whatever
		private_key_file = ${certdir}/rsa/server.pem

		ca_file = ${cadir}/rsa/ca.pem
	}

	ca_file = ${cadir}/rsa/ca.pem
	ca_path = ${cadir}

	fragment_size = 8192

	cipher_list = "DEFAULT"
	cipher_server_preference = yes

	#
	#  Session resumption is disabled, so the `load session`,
	#  `store session` and `clear session` sections are compiled but never
	#  called.
	#
	#  To enable session resumption, set `name` in this section, and point
	#  those three sections at a cache module.
	#
	#
	#  Stateful resumption is only defined below TLS 1.3, see
	#  src/lib/tls/conf.c and tls_cache_store_cb() in src/lib/tls/cache.c.
	#

	session {
		mode = stateless
		name = "unit_test_tls server"
	}

	verify {
		attribute_mode = client-and-issuer
	}
}

#
#  The configuration used by `-s server[:port]`, which turns the
#  program around: instead of listening for a connection from a
#  client, it makes a connection to a server.
#
tls client {
	#
	#  Naming a virtual server is what makes a client run policy.  Without
	#  it, OpenSSL validates the server certificate on its own and no
	#  section runs.  With it, the `verify certificate` section below runs
	#  against the server's certificate, exactly as it does on the server
	#  side against the client's.
	#
	#
	#  A separate virtual server from the one the server role uses, so
	#  that each can key its cache its own way.
	#
	virtual_server = tls-client


	session {
		mode = stateless
		name = "unit_test_tls client"
	}

	verify {
		attribute_mode = client-and-issuer
	}

	chain {
		certificate_file = ${certdir}/rsa/client.pem

		private_key_password = whatever
		private_key_file = ${certdir}/rsa/client.key

		ca_file = ${cadir}/rsa/ca.pem
	}

	ca_file = ${cadir}/rsa/ca.pem
	ca_path = ${cadir}

	cipher_list = "DEFAULT"
}

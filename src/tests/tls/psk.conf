#  -*- text -*-
#
#  Test configuration file.  Do not install.
#
#  A client that authenticates with a pre-shared key (PSK) connects to a
#  server that finds the key with the `load psk` section of the `tls`
#  virtual server in `common.conf`.
#
#  The test exists to check where `load psk` runs.  OpenSSL calls the PSK
#  callback from inside the handshake, on a fibre whose stack OpenSSL
#  sizes.  The unlang interpreter never runs on that stack.  The
#  callback therefore pauses the handshake, and the section runs on the
#  request's own stack before the handshake resumes.
#  fr_tls_session_psk_server_cb() in `src/lib/tls/session.c` has the
#  details.  `psk.sh` checks the server log for the section and for a
#  completed handshake over a PSK cipher.
#
#  `tls_max_version = 1.2` limits the handshake to TLS 1.2, so the handshake
#  uses the TLS 1.2 PSK key exchange.
#
#  $Id$
#
$INCLUDE common.conf

unit_test_tls {
	ipaddr = 127.0.0.1
	port = 2083

	server {
		virtual_server = tls

		#
		#  The server requires a certificate chain at startup.  None of the
		#  ciphers in `cipher_list` below sends a certificate, so the handshake
		#  never uses the chain.
		#
		chain {
			certificate_file = ${certdir}/rsa/server.pem
			private_key_password = whatever
			private_key_file = ${certdir}/rsa/server.pem
			ca_file = ${cadir}/rsa/ca.pem
		}

		#
		#  The list offers only PSK ciphers, so a handshake that completes
		#  proves that the server found the key.  The RSA-PSK ciphers also
		#  send the server certificate, and the client has no CA to check
		#  the certificate.  The list therefore leaves the RSA-PSK ciphers out.
		#
		cipher_list = "PSK:!kRSAPSK"
		tls_max_version = 1.2

		session {
			mode = disabled
		}
	}

	client {
		virtual_server = tls-client

		cipher_list = "PSK:!kRSAPSK"
		tls_max_version = 1.2

		session {
			mode = disabled
		}

		#
		#  The identity is the key written as hex.  The server's `load psk`
		#  section decodes the identity into the key.
		#
		psk_identity = "0123456789abcdef0123456789abcdef"
		psk_hexphrase = "0123456789abcdef0123456789abcdef"
	}
}

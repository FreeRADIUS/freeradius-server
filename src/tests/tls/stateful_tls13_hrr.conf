#  -*- text -*-
#
#  Test configuration file.  Do not install.
#
#  stateful_tls13.conf with a server which only accepts the P-256 curve.
#
#  The client lists X25519 first, so the first ClientHello has a key share for
#  X25519 only.  `ecdh_curve` sets the groups of a client.  A TLS 1.3 server which only accepts P-256 answers with a
#  HelloRetryRequest which asks for a P-256 key share, and the client sends a
#  second ClientHello.  OpenSSL then calls the session load callback a second
#  time for the same connection.
#
#  Both ends set tls_min_version to 1.3, so a handshake which falls back to
#  TLS 1.2 fails instead of resuming statefully and passing the test.  The
#  server keeps the session in the `cache_tls_session` store, so `load session`
#  and `store session` run on the server.  `encode session` and
#  `decode session` do not run.
#
#  $Id$
#

$INCLUDE common.conf

unit_test_tls {
	transport = tcp

	tcp {
		ipaddr = 127.0.0.1
		port = $ENV{PORT}
	}
	require_client_certificate = yes

	server {
		virtual_server = tls

		chain {
			certificate_file = ${certdir}/rsa/server.pem

			private_key_password = whatever
			private_key_file = ${certdir}/rsa/server.pem

			ca_file = ${cadir}/rsa/ca.pem
		}

		ca_file = ${cadir}/rsa/ca.pem
		ca_path = ${cadir}

		fragment_size = 8192

		cipher_list = "DEFAULT"
		cipher_server_preference = yes

		tls_min_version = 1.3
		ecdh_curve = "prime256v1"

		session {
			mode = stateful
			name = "unit_test_tls server"
		}

		verify {
			attribute_mode = client-and-issuer
		}
	}

	client {
		virtual_server = tls-client

		tls_min_version = 1.3
		ecdh_curve = "X25519:prime256v1"

		session {
			mode = stateful
			name = "unit_test_tls client"
		}

		verify {
			attribute_mode = client-and-issuer
		}

		chain {
			certificate_file = ${certdir}/rsa/client.pem

			private_key_password = whatever
			private_key_file = ${certdir}/rsa/client.key

			ca_file = ${cadir}/rsa/ca.pem
		}

		ca_file = ${cadir}/rsa/ca.pem
		ca_path = ${cadir}

		cipher_list = "DEFAULT"
	}
}

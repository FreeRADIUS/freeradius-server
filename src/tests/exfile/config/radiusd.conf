#  -*- text -*-
#
#  test configuration file.  Do not install.
#
#  The detail module writes to a file in a directory which can't be
#  created, as its parent is a regular file.  Every accounting request
#  makes the module fail to open the file, from many threads at once.
#
top_srcdir	= $ENV{TOP_SRCDIR}
run_dir		= ${top_srcdir}/$ENV{OUTPUT}
pidfile		= ${run_dir}/radiusd.pid

client localhost {
	ipaddr = 127.0.0.1
	secret = testing123
}

#  Only for testing!
#  Setting this on a production system is a BAD IDEA.
security {
	allow_vulnerable_openssl = yes
}

thread pool {
	start_servers = 16
	max_servers = 16
	min_spare_servers = 0
	max_spare_servers = 16
	max_requests_per_server = 0
	auto_limit_acct = no
}

modules {
	always ok {
		rcode = ok
	}

	#
	#  The default file name.  "locking = no" is the default, too: the
	#  file is opened without the mutex.
	#
	detail {
		filename = ${run_dir}/notadir/%{%{Packet-Src-IP-Address}:-%{Packet-Src-IPv6-Address}}/detail-%Y%m%d
		permissions = 0600
		locking = no
	}
}

server default {
	listen {
		type = acct
		ipaddr = 127.0.0.1
		port = $ENV{PORT}
	}

	#
	#  Add an attribute, as the preprocess module does.  The
	#  allocations around the detail module's make corrupted memory
	#  show up quickly.
	#
	preacct {
		update request {
			&Event-Timestamp := "%l"
		}
	}

	#
	#  Reply even though the detail module fails, and say that it
	#  did.
	#
	accounting {
		detail {
			fail = 1
		}
		if (fail) {
			update reply {
				&Reply-Message := "detail failed"
			}
			ok
		}
	}
}

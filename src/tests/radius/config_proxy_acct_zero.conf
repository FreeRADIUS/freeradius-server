#  -*- text -*-
#
#  Test configuration file.  Do not install.
#
#  mode = proxy.  A max_rtx_duration of 0 for Accounting-Request is forced to 30 seconds, with a warning.
#
#  The environment gives the two ports:
#
#	PORT	the port of the home server
#	LPORT	the UDP port where radiusd receives Access-Request packets
#

raddb		= raddb
modconfdir	= ${raddb}/mods-config
logdir		= build/tests/radius/

#  Only for testing!
#  Setting this on a production system is a BAD IDEA.
security {
	allow_vulnerable_openssl = yes
	allow_core_dumps = yes
}

modules {
	radius home {
		mode = proxy
		transport = udp
		type = Accounting-Request
		require_message_authenticator = no
		Accounting-Request {
			max_rtx_duration = 0
		}

		udp {
			ipaddr = 127.0.0.1
			port = $ENV{PORT}
			secret = testing123
		}
	}
}

client testclient {
	ipaddr = 127.0.0.1
	secret = testing123
	proto = udp
}

server default {
	namespace = radius

	listen {
		type = Accounting-Request
		transport = udp

		udp {
			ipaddr = 127.0.0.1
			port = $ENV{LPORT}
		}
	}

	recv Accounting-Request {
		home
	}

}

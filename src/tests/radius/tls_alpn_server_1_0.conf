#  -*- text -*-
#
#  Test configuration file.  Do not install.
#
#  mode = client over RADIUS/TLS with both ALPN names.  The home server offers only
#  radius/1.0, and the connection uses RADIUS/1.0.
#
#  The environment gives the two ports:
#
#	PORT	the port of the home server
#	LPORT	the UDP port where radiusd receives Access-Request packets
#

raddb		= raddb
certdir		= ${raddb}/certs
modconfdir	= ${raddb}/mods-config
logdir		= build/tests/radius/

#  Only for testing!
#  Setting this on a production system is a BAD IDEA.
security {
	allow_vulnerable_openssl = yes
	allow_core_dumps = yes
}

modules {
	radius home {
		mode = client
		transport = tcp
		type = Access-Request
		Access-Request {
			initial_rtx_time = 1
			max_rtx_time = 5
			max_rtx_count = 5
			max_rtx_duration = 5
		}

		tcp {
			ipaddr = 127.0.0.1
			port = $ENV{PORT}

			tls {
				ca_file = ${certdir}/rsa/ca.pem
				ca_path = ${certdir}

				tls_min_version = 1.3

				alpn {
					radius_v1_1 = yes
					radius_v1_0 = yes
				}
			}
		}
	}
}

client testclient {
	ipaddr = 127.0.0.1
	secret = testing123
	proto = udp
}

server default {
	namespace = radius

	listen {
		type = Access-Request
		transport = udp

		udp {
			ipaddr = 127.0.0.1
			port = $ENV{LPORT}
		}
	}

	recv Access-Request {
		control.Auth-Type := ::proxy
	}

	authenticate proxy {
		home
	}
}

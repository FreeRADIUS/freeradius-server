#  -*- text -*-
#
#  Test configuration file.  Do not install.
#
#  mode = proxy over UDP.  The connection becomes zombie only after response_timeouts requests in a row time out.
#
#  The environment gives the two ports:
#
#	PORT	the port of the home server
#	LPORT	the UDP port where radiusd receives Access-Request packets
#

raddb		= raddb
modconfdir	= ${raddb}/mods-config
logdir		= build/tests/radius/

#  Only for testing!
#  Setting this on a production system is a BAD IDEA.
security {
	allow_vulnerable_openssl = yes
	allow_core_dumps = yes
}

modules {
	radius home {
		mode = proxy
		transport = udp
		type = Access-Request
		require_message_authenticator = no
		zombie_period = 8
		response_timeouts = 3
		Access-Request {
			initial_rtx_time = 1
			max_rtx_time = 5
			max_rtx_count = 5
			max_rtx_duration = 5
		}

		udp {
			ipaddr = 127.0.0.1
			port = $ENV{PORT}
			secret = testing123
		}
	}
}

client testclient {
	ipaddr = 127.0.0.1
	secret = testing123
	proto = udp
}

server default {
	namespace = radius

	listen {
		type = Access-Request
		transport = udp

		udp {
			ipaddr = 127.0.0.1
			port = $ENV{LPORT}
		}
	}

	recv Access-Request {
		control.Auth-Type := ::proxy
	}

	authenticate proxy {
		home
	}

}

name: Defect Report
description: Used to report a defect in server source code, default configuration files, documentation, scripts etc...
title: "[defect]: "
labels: [defect]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: dropdown
    id: defect_type
    attributes:
      label: What type of defect/bug is this?
      options:
        - Crash or memory corruption (segv, abort, etc...)
        - Non compliance with a standards document
        - incorrect 3rd party API usage
        - Unexpected behaviour (obvious or verified by project member)
        - Documentation or repository content defect
    validations:
      required: true
  - type: textarea
    id: documentation_reference
    attributes:
      label: Affected documentation or repository URL/path
      description: For documentation defects, link to the affected page or file.
    validations:
      required: false
  - type: textarea
    id: how_to_reproduce
    attributes:
      label: How can the issue be reproduced?
      description: For runtime defects, give the server version, configuration change, test request, expected reply, and actual reply or error. For documentation defects, give the affected page, incorrect text or link, and expected correction.
      placeholder: 'Runtime: run radiusd -X, send this request, observe this error. Documentation: open this page or link, observe this missing or incorrect content.'
    validations:
      required: true
  - type: textarea
    id: log_output
    attributes:
      label: Log output from the FreeRADIUS daemon
      description: For runtime defects, paste the `radiusd -X` output showing the failing request, or the startup error if it cannot start. Leave blank for documentation-only defects. Review output for secrets before posting.
      placeholder: $ radiusd -X
      render: shell
    validations:
      required: false
  - type: textarea
    id: log_output_client
    attributes:
      label: Relevant log output from client utilities
      description: If you used `radclient`, `dhclient`, `eapol_test`, or `wpa_supplicant`, include the command and resulting response or error.
  - type: textarea
    id: backtrace
    attributes:
      label: Backtrace from LLDB or GDB
      description: |
        Provide a full backtrace from LLDB or GDB (if relevant). 
        See [here](https://github.com/FreeRADIUS/freeradius-server/blob/master/doc/antora/modules/developers/pages/bugs/bugs.adoc) for debugging instructions and how to obtain backtraces.
      placeholder: $ lldb -- radiusd -X
      render: shell


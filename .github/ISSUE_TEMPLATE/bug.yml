name: Defect Report
description: Used to report a defect in server source code, default configuration files, documentation, scripts etc...
title: "[defect]: "
labels: [defect]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: dropdown
    id: defect_type
    attributes:
      label: What type of defect/bug is this?
      options:
        - Crash or memory corruption (segv, abort, etc...)
        - Non compliance with a standards document
        - incorrect 3rd party API usage
        - Unexpected behaviour (obvious or verified by project member)
        - Documentation or repository content defect
    validations:
      required: true
  - type: textarea
    id: documentation_reference
    attributes:
      label: Affected documentation or repository URL/path
      description: For documentation defects, link to the affected page or file.
    validations:
      required: false
  - type: textarea
    id: how_to_reproduce
    attributes:
      label: How can the issue be reproduced?
      description: A clear and concise list of steps describing how to reproduce the issue.
      placeholder: Describe the steps to reproduce the issue, including broken links or incorrect documentation when applicable.
    validations:
      required: true
  - type: textarea
    id: log_output
    attributes:
      label: Log output from the FreeRADIUS daemon
      description: Include relevant daemon debug output for runtime defects when available. Not applicable to documentation-only defects.
      placeholder: $ radiusd -X
      render: shell
    validations:
      required: false
  - type: textarea
    id: log_output_client
    attributes:
      label: Relevant log output from client utilities
      description: Output of `radclient`, `dhclient`, `eapol_test`, `wpa_supplicant` etc... Only include if relevent.
  - type: textarea
    id: backtrace
    attributes:
      label: Backtrace from LLDB or GDB
      description: |
        Provide a full backtrace from LLDB or GDB (if relevant). 
        See [here](https://github.com/FreeRADIUS/freeradius-server/blob/master/doc/antora/modules/developers/pages/bugs.adoc) for debugging instructions and how to obtain backtraces.
      placeholder: $ lldb -- radiusd -X
      render: shell


name: Common vars

#
#  This workflow determines the values that every other workflow needs, so no
#  workflow determines the values for itself.
#
#    docker_registry   which registry holds the continuous integration (CI)
#                      images
#    selfhosted        whether the organisation's own build machines are
#                      available
#    docker_prefix     what to put in front of a third-party image name
#    images_changed    whether this ref changes anything that the CI images
#                      bake in
#    images_tooling    whether this ref changes anything that the tooling
#                      images bake in
#    images_deb        whether this ref changes anything that the Debian and
#                      Ubuntu images bake in
#    images_rpm        whether this ref changes anything that the Rocky images
#                      bake in
#    docs_changed      whether this ref changes anything that the
#                      documentation uses
#    image_prefix      registry and path that the CI images sit under
#    image_tag         which tag of the CI images this ref should use
#    llvm_version      major version of LLVM every job builds with
#    gcc_version       major version of GCC every job builds with
#
#  `docker_registry`, `selfhosted` and `docker_prefix` follow from whether the
#  run happens in the FreeRADIUS organisation or in somebody else's fork.
#  `images_changed`, `docs_changed` and `image_tag` follow from whether this ref
#  changes the images or the documentation, which paths-filter answers by
#  diffing against the default branch.  A change to the packaging files under
#  `debian/` and `redhat/` counts as an image change only when the change
#  alters the build dependencies (see `scripts/ci/images-build-deps.sh`).
#  `images_changed` is true when any of `images_tooling`, `images_deb`, and
#  `images_rpm` is true.
#
#  Every workflow that reads any of the values calls this workflow for
#  itself.  GitHub cannot evaluate a reusable workflow once and share the
#  result.  Passing the answers down as inputs would leave a workflow that
#  starts from the nightly schedule or by hand with nothing.
#
#  The answers come back as job outputs rather than as a workflow-level `env:`
#  block, because GitHub does not let the `container:`, `services:`, `runs-on:`
#  and `strategy:` keys read the `env` context.  The same keys can all read
#  `needs`, so a caller writes `needs.common_vars.outputs.<name>` instead.
#
#  To use in another workflow: add a job named `common_vars` that calls this
#  workflow, then name `common_vars` in the `needs:` of every job that reads an
#  answer.
#
#  To add another value: add an output below, and add a line to the `evaluate`
#  step that writes the value.
#
#
#  `common_vars.yml` sets the compiler versions so that the CI image,
#  `runner-prep`, and the macOS job all install the same release.  Change
#  the versions here only.
#
env:
  LLVM_VERSION: 23
  GCC_VERSION: 14

on:
  workflow_call:
    outputs:
      docker_registry:
        description: "registry holding the CI images"
        value: ${{ jobs.common_vars.outputs.docker_registry }}
      selfhosted:
        description: "'1' when the org's self-hosted runners and registry are available"
        value: ${{ jobs.common_vars.outputs.selfhosted }}
      docker_prefix:
        description: "prefix that points a third-party image at the repository's copy in the org's registry, empty elsewhere"
        value: ${{ jobs.common_vars.outputs.docker_prefix }}
      images_changed:
        description: "'true' when this ref changes something the CI images bake in"
        value: ${{ jobs.common_vars.outputs.images_changed }}
      images_tooling:
        description: "'true' when this ref changes something the tooling images bake in"
        value: ${{ jobs.common_vars.outputs.images_tooling }}
      images_deb:
        description: "'true' when this ref changes something the Debian and Ubuntu images bake in"
        value: ${{ jobs.common_vars.outputs.images_deb }}
      images_rpm:
        description: "'true' when this ref changes something the Rocky images bake in"
        value: ${{ jobs.common_vars.outputs.images_rpm }}
      docs_changed:
        description: "'true' when this ref changes something the documentation is built from"
        value: ${{ jobs.common_vars.outputs.docs_changed }}
      image_prefix:
        description: "registry and path every CI image sits under, ending in a slash"
        value: ${{ jobs.common_vars.outputs.image_prefix }}
      image_tag:
        description: "tag of the CI images this ref should build against"
        value: ${{ jobs.common_vars.outputs.image_tag }}
      llvm_version:
        description: "major version of LLVM every job builds with"
        value: ${{ jobs.common_vars.outputs.llvm_version }}
      gcc_version:
        description: "major version of GCC every job builds with"
        value: ${{ jobs.common_vars.outputs.gcc_version }}

jobs:
  common_vars:
    name: Evaluate

    #  For a pull request, paths-filter reads the list of changed files from
    #  the GitHub Representational State Transfer (REST) API.
    permissions:
      contents: read
      pull-requests: read

    runs-on: ${{ github.repository_owner == 'FreeRADIUS' && 'self-hosted' || 'ubuntu-latest' }}

    outputs:
      docker_registry: ${{ steps.evaluate.outputs.docker_registry }}
      selfhosted: ${{ steps.evaluate.outputs.selfhosted }}
      docker_prefix: ${{ steps.evaluate.outputs.docker_prefix }}
      images_changed: ${{ steps.evaluate.outputs.images_changed }}
      images_tooling: ${{ steps.evaluate.outputs.images_tooling }}
      images_deb: ${{ steps.evaluate.outputs.images_deb }}
      images_rpm: ${{ steps.evaluate.outputs.images_rpm }}
      docs_changed: ${{ steps.changed.outputs.docs_changed }}
      image_prefix: ${{ steps.evaluate.outputs.image_prefix }}
      image_tag: ${{ steps.evaluate.outputs.image_tag }}
      llvm_version: ${{ steps.evaluate.outputs.llvm_version }}
      gcc_version: ${{ steps.evaluate.outputs.gcc_version }}

    steps:
      #  paths-filter diffs a push locally, so paths-filter needs a checkout.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: false

      #
      #  Does this ref change anything that the CI images bake in?
      #
      #  On the default branch the answer describes the newest commit,
      #  because the newest commit decides whether to rebuild the shared
      #  images.  On any other branch paths-filter compares against the
      #  default branch instead, so the answer describes the whole branch.
      #  The answer stays the same no matter how the author split the commits
      #  or how long ago the commit that changed the images landed.
      #
      #  A scheduled or hand-started run has nothing to diff against, so the
      #  step does not run and the answer is empty, which reads as no change.
      #
      - name: Determine what this ref changes
        uses: dorny/paths-filter@v4.0.3
        id: changed
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        with:
          filters: |
            docs_changed:
              - '.github/workflows/documentation.yml'
              - 'doc/**'
              - 'man/**'
              - 'raddb/**'
              - 'share/**'

            #
            #  The refresh workflows rebuild the images one family at a
            #  time, and copy `latest` to this ref's tag for every family
            #  that this ref does not change.  Each `*_paths` filter lists
            #  the files that a family's Dockerfiles copy in, so a change
            #  that only one family reads rebuilds only that family.  The
            #  `evaluate` step combines the `*_paths` filters with the
            #  `packaging_*` filters into `images_tooling`, `images_deb`,
            #  `images_rpm`, and `images_changed`.
            #
            #  The shared inputs are the files that every family reads, and
            #  the files that decide what gets built and where the result is
            #  published.
            #
            images_inputs_shared: &images_inputs_shared
              - 'scripts/ci/eapol_test-build.sh'
              - 'scripts/ci/eapol_test/**'
              - 'scripts/ci/images-build-deps.sh'
              - 'scripts/docker/docker.mk'
              - '.github/workflows/docker-ci-images-refresh.yml'
              - '.github/workflows/docker-ci-images-build.yml'
              - '.github/workflows/docker-freeradius-images-refresh.yml'
              - '.github/workflows/docker-freeradius-images-build.yml'
              - '.github/actions/image-copy/**'
            #  The tooling images are 'self-hosted', the main build image,
            #  and 'self-hosted-docker-cli' plus 'self-hosted-docker-dind',
            #  which the other image builds run inside.  'self-hosted'
            #  installs the build dependencies from `debian/control`, and
            #  'self-hosted-docker-cli' is built on top of 'self-hosted'.
            images_tooling_paths:
              - *images_inputs_shared
              - 'scripts/ci/extra-packages.debian.control'
              - 'scripts/ci/docker/Dockerfile*'
              - 'scripts/ci/ubuntu-mirrors-setup.sh'
            images_deb_paths:
              - *images_inputs_shared
              - 'scripts/ci/extra-packages.debian.control'
              - 'scripts/docker/build/debian*/Dockerfile.ci'
              - 'scripts/docker/build/debian*/Dockerfile.crossbuild'
              - 'scripts/docker/build/debian*/Dockerfile.service'
              - 'scripts/docker/build/ubuntu*/Dockerfile.ci'
              - 'scripts/docker/build/ubuntu*/Dockerfile.crossbuild'
              - 'scripts/docker/build/ubuntu*/Dockerfile.radenv-profiling-deps'
              - 'scripts/docker/build/ubuntu*/Dockerfile.service'
            images_rpm_paths:
              - *images_inputs_shared
              - 'scripts/docker/build/rocky*/Dockerfile.ci'
              - 'scripts/docker/build/rocky*/Dockerfile.crossbuild'
              - 'scripts/docker/build/rocky*/Dockerfile.service'
            #
            #  The images read only the build dependencies from the
            #  packaging files.  The `evaluate` step counts a change to the
            #  packaging files as an image change only when the change alters
            #  the build dependencies.
            #
            packaging_deb:
              - 'debian/**'
            packaging_rpm:
              - 'redhat/**'

      #
      #  docker_registry:  The FreeRADIUS organisation sets a repository
      #  variable named `DOCKER_REGISTRY` that points at the organisation's own
      #  registry.  GitHub does not copy repository variables into a fork, so
      #  in a fork the variable is empty and the answer becomes the fork's
      #  own GitHub Container Registry (GHCR) namespace.  A fork can push to
      #  no other registry.
      #
      #  docker_prefix:  The organisation keeps a local copy of third-party
      #  images ('mariadb', 'postgres', '389ds'), so a build fetches each image
      #  from Docker Hub once rather than every time.  `docker_prefix` points
      #  an image name at the local copy.  A fork keeps no local copy, so
      #  `docker_prefix` stays empty and a fork fetches the third-party images
      #  from Docker Hub under plain image names.
      #
      #  image_tag:  The default branch uses `latest`.  A branch that changes
      #  the images gets a tag named after the branch, so the images that the
      #  branch builds never overwrite what the default branch and every
      #  other branch read.  A branch that leaves the images alone reads
      #  `latest`, because the images that the branch would build are the
      #  images already published.
      #
      #  Only a push gets a tag named after the branch, because only a push
      #  rebuilds the images.  A pull request that named a tag would name a
      #  tag that nothing ever published, and every job would fail to pull
      #  the tag.
      #
      #  image_prefix:  Every image that this repository publishes sits under
      #  a path named after the repository, so several repositories can share
      #  one registry without colliding.  Anything that sweeps the registry
      #  can also tell this repository's images from every other repository's
      #  images.
      #
      #  A docker tag holds at most 128 characters of letters, digits,
      #  underscore, period and dash.  The `evaluate` step turns anything else
      #  in a branch name into a dash and cuts the result to 128 characters.
      #
      - name: Evaluate vars
        id: evaluate
        env:
          registry_override: ${{ vars.DOCKER_REGISTRY }}
          owner: ${{ github.repository_owner }}
          selfhosted: ${{ github.repository_owner == 'FreeRADIUS' && '1' || '0' }}
          default_branch: ${{ github.event.repository.default_branch }}
          ref_name: ${{ github.ref_name }}
          repo_name: ${{ github.event.repository.name }}
          images_tooling_paths: ${{ steps.changed.outputs.images_tooling_paths }}
          images_deb_paths: ${{ steps.changed.outputs.images_deb_paths }}
          images_rpm_paths: ${{ steps.changed.outputs.images_rpm_paths }}
          packaging_deb: ${{ steps.changed.outputs.packaging_deb }}
          packaging_rpm: ${{ steps.changed.outputs.packaging_rpm }}
          before: ${{ github.event.before }}
          event: ${{ github.event_name }}
        run: |
          #
          #  The `DOCKER_REGISTRY` variable always wins when set.  GitHub does
          #  not deliver repository variables to a pull request from a fork,
          #  so runs in the FreeRADIUS repository fall back to the
          #  organisation's own registry.  A fork that runs CI in the fork's
          #  own repository falls back to the fork's GHCR namespace, because
          #  a fork can push nowhere else.  Docker rejects uppercase in the
          #  image path, and `github.repository_owner` preserves case, so the
          #  step lowercases the owner.
          #
          if [ -n "$registry_override" ]; then
            registry="$registry_override"
          elif [ "$selfhosted" = "1" ]; then
            registry=docker.internal.networkradius.com
          else
            registry="ghcr.io/$(printf '%s' "$owner" | tr 'A-Z' 'a-z')"
          fi

          #
          #  `docker-ci-images-refresh.yml` publishes the repository's copies
          #  of third-party images under `$repo_name/`, the same path as the
          #  CI images. One registry rule therefore serves both the CI images
          #  and the copies to the public `anonymous` account.
          #
          prefix=
          if [ "$selfhosted" = "1" ]; then
            prefix="$registry/$repo_name/"
          fi

          #
          #  A change under `debian/` or `redhat/` changes the images only
          #  when the change alters the build dependencies, because the images
          #  read nothing else from the packaging files.
          #  `scripts/ci/images-build-deps.sh` prints a family's build
          #  dependencies at a revision.  The step compares this ref with the
          #  revision that paths-filter diffed against:
          #
          #    1. A push to the default branch compares with the previous tip
          #       of the default branch, `github.event.before`.
          #    2. A push to any other branch compares with the merge base of
          #       the branch and the default branch.  paths-filter has already
          #       fetched the default branch.
          #
          #  Any other event, or a base revision that the step cannot fetch,
          #  leaves `deps_base` empty.  An empty `deps_base` counts every
          #  packaging change as an image change.
          #
          deps_base=
          if [ "$event" = "push" ]; then
            if [ "$ref_name" = "$default_branch" ]; then
              if git fetch --no-tags --depth=1 origin "$before"; then
                deps_base="$before"
              fi
            else
              deps_base=$(git merge-base "origin/$default_branch" HEAD) || deps_base=
            fi
          fi

          #  Succeeds when this ref changes the build dependencies of the
          #  family named by the first argument, `rpm` or `deb`.
          build_deps_changed() {
            [ -n "$deps_base" ] || return 0
            [ "$(scripts/ci/images-build-deps.sh "$1" HEAD)" \
              != "$(scripts/ci/images-build-deps.sh "$1" "$deps_base")" ]
          }

          deb_deps_changed=false
          if [ "$packaging_deb" = "true" ] && build_deps_changed deb; then
            deb_deps_changed=true
          fi

          rpm_deps_changed=false
          if [ "$packaging_rpm" = "true" ] && build_deps_changed rpm; then
            rpm_deps_changed=true
          fi

          #
          #  The tooling images install the Debian build dependencies, as
          #  the Debian and Ubuntu images do.
          #
          images_tooling=false
          if [ "$images_tooling_paths" = "true" ] || [ "$deb_deps_changed" = "true" ]; then
            images_tooling=true
          fi

          images_deb=false
          if [ "$images_deb_paths" = "true" ] || [ "$deb_deps_changed" = "true" ]; then
            images_deb=true
          fi

          images_rpm=false
          if [ "$images_rpm_paths" = "true" ] || [ "$rpm_deps_changed" = "true" ]; then
            images_rpm=true
          fi

          images_changed=false
          if [ "$images_tooling" = "true" ] || [ "$images_deb" = "true" ] \
             || [ "$images_rpm" = "true" ]; then
            images_changed=true
          fi

          echo "Build dependencies compared with ${deps_base:-no base revision}: deb changed $deb_deps_changed, rpm changed $rpm_deps_changed"

          image_tag=latest
          if [ "$event" = "push" ] && [ "$ref_name" != "$default_branch" ] \
             && [ "$images_changed" = "true" ]; then
            image_tag=$(printf '%s' "$ref_name" \
                        | tr 'A-Z' 'a-z' \
                        | tr -c 'a-z0-9_.-' '-' \
                        | cut -c1-128)
          fi

          {
            echo "docker_registry=$registry"
            echo "selfhosted=$selfhosted"
            echo "docker_prefix=$prefix"
            echo "image_prefix=$registry/$repo_name/"
            echo "image_tag=$image_tag"
            echo "images_changed=$images_changed"
            echo "images_tooling=$images_tooling"
            echo "images_deb=$images_deb"
            echo "images_rpm=$images_rpm"
            echo "llvm_version=$LLVM_VERSION"
            echo "gcc_version=$GCC_VERSION"
          } >> "$GITHUB_OUTPUT"

name: Docker CI images refresh

#
#  `ci-pipeline.yml` calls this workflow before the pipeline's build legs
#  when a commit touches anything baked into the images, so the legs never
#  build against stale images.  `docker-images-refresh-nightly.yml` calls this
#  workflow on the schedule and on `workflow_dispatch`.  This workflow has no
#  `push:` trigger.  The pipeline already runs on push, and a second
#  standalone run would race the run that the pipeline waits for.  The
#  pipeline's 'changes' job holds the list of paths that trigger a refresh.
#
on:
  workflow_call:

concurrency:
  #
  #  Only one refresh runs at a time, and a push queues a second run
  #  instead of cancelling the run in flight.  An interrupted refresh
  #  leaves the registry partially updated, whereas a queued second run
  #  re-publishes everything cleanly after the first run finishes.
  #
  group: docker-ci-images-refresh
  cancel-in-progress: false

jobs:
  #
  #  This job determines which registry holds the continuous integration
  #  (CI) images.  A caller that already has the answer passes the answer
  #  as an input.  A run that starts from the nightly schedule or by hand receives
  #  no inputs, so this job determines the answer instead.  See
  #  `.github/workflows/common_vars.yml`.
  #
  common_vars:
    name: Common vars
    uses: ./.github/workflows/common_vars.yml

  #
  #  Stage 1: rebuild the runner-host base and the Docker-in-Docker (dind)
  #  sidecar image from upstream.  The rebuilds cannot run inside our own
  #  dind/cli container, because the two images are the parents of the
  #  dind/cli container.
  #
  process-host-bases:
    needs: common_vars
    timeout-minutes: 40

    env:
      DOCKER_REGISTRY: ${{ needs.common_vars.outputs.docker_registry }}
      IMAGE_PREFIX: ${{ needs.common_vars.outputs.image_prefix }}
      IMAGE_TAG: ${{ needs.common_vars.outputs.image_tag }}

    runs-on: ${{ needs.common_vars.outputs.selfhosted == '1' && 'self-hosted' || 'ubuntu-latest' }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - base_image: ubuntu:24.04
            display: self-hosted-ubuntu24
            extra_tags:
              - self-hosted
            dockerfile: scripts/ci/docker/Dockerfile
            needs_build_deps: true

          #
          #  Custom dind sidecar image for the dind-based
          #  workflows (`docker-service.yml`, `docker-crossbuild.yml`, `multi-server-tests`).
          #  The image sets the registry mirror to the internal cache and
          #  trusts the internal certificate authority (CA), so the jobs
          #  do not apt-install packages or write `daemon.json`.
          #
          - base_image: docker:27-dind
            display: self-hosted-docker-dind
            dockerfile: scripts/ci/docker/Dockerfile.docker-dind
            needs_internal_ca: true

    name: "${{ matrix.os.display }}"

    steps:

      - uses: actions/checkout@v6
        with:
          lfs: false

      - name: Login to Docker Hub
        if: ${{ needs.common_vars.outputs.selfhosted == '1' }}
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_READ_USER }}
          password: ${{ secrets.DOCKERHUB_READ_KEY }}

      - name: Fetch and label image
        env:
          DOCKER_BASE_IMAGE: ${{ matrix.os.base_image }}
        run: |
          for attempt in 1 2 3; do
            docker pull "$DOCKER_BASE_IMAGE" && break
            if [ "$attempt" = 3 ]; then exit 1; fi
            echo "Retrying pull after backoff, attempt $attempt failed"
            sleep 10
          done
          echo "FROM $DOCKER_BASE_IMAGE" | docker build --label preserve=true -t "$DOCKER_REGISTRY/$DOCKER_BASE_IMAGE" -

      - name: Stage registry mirror CA into build context
        if: ${{ matrix.os.needs_internal_ca && needs.common_vars.outputs.selfhosted == '1' }}
        run: |
          cp /usr/local/share/ca-certificates/networkradius.com.crt \
             scripts/ci/networkradius.com.crt

      - name: Create build dependency package
        if: ${{ matrix.os.needs_build_deps }}
        env:
          DOCKER_BASE_IMAGE: ${{ matrix.os.base_image }}
        run: |
          cat > build-dep-pkg.sh << EOF
          apt-get update
          export DEBIAN_FRONTEND=noninteractive
          apt-get install -y --no-install-recommends build-essential devscripts equivs quilt
          cd /work
          debian/rules debian/control
          mk-build-deps debian/control
          mv freeradius-build-deps_*.deb freeradius-build-deps.deb
          mk-build-deps scripts/ci/extra-packages.debian.control
          mv freeradius-build-deps_1*.deb freeradius-build-deps-extra.deb
          chown $(stat -c'%u:%g' .git) *
          EOF
          chmod 755 build-dep-pkg.sh
          docker run \
            -v ${{ github.workspace }}:/work \
            -w /work \
            --rm \
            "$DOCKER_BASE_IMAGE" \
            sh -c './build-dep-pkg.sh'

      - name: Build main Docker image
        env:
          DOCKER_IMAGE_NAME: ${{ needs.common_vars.outputs.image_prefix }}${{ matrix.os.display }}:${{ needs.common_vars.outputs.image_tag }}
          DOCKERFILE: ${{ matrix.os.dockerfile }}
          #  Reused layers hide new upstream packages, and fetching new
          #  packages is why the nightly run exists, so only the nightly
          #  run discards the layers.  Every other run rebuilds because a file
          #  changed, and discarding the layers in such a run costs 20+
          #  minutes for nothing.
          NO_CACHE: ${{ github.event_name == 'schedule' && '--no-cache' || '' }}
          REGISTRY_MIRROR: ${{ needs.common_vars.outputs.selfhosted == '1' && env.DOCKER_REGISTRY || '' }}
          #  BuildKit builds only the stages that the selected stage
          #  depends on, so the certificate `COPY` in `Dockerfile.docker-dind`
          #  never runs on a fork, where the certificate is absent.  The
          #  older builder builds every stage and fails on the `COPY`.
          DOCKER_BUILDKIT: 1
        run: |
          build_args=()
          if [ -n "$REGISTRY_MIRROR" ]; then
            build_args+=(--build-arg "registry_mirror_stage=configured")
            build_args+=(--build-arg "registry_mirror=$REGISTRY_MIRROR")
          fi
          for attempt in 1 2 3; do
            docker build $NO_CACHE -f "$DOCKERFILE" -t "$DOCKER_IMAGE_NAME" --label preserve=true "${build_args[@]}" . && exit 0
            echo "Retrying build after backoff, attempt $attempt failed"
            sleep 10
          done
          exit 1

      - name: Login to internal Docker registry for push
        if: ${{ needs.common_vars.outputs.selfhosted == '1' }}
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_REPO_UPDATE_USERNAME }}
          password: ${{ secrets.DOCKER_REPO_UPDATE_PASSWORD }}
          registry: ${{ env.DOCKER_REGISTRY }}

      #  A fork pushes to the fork's own GitHub Container Registry (GHCR)
      #  namespace, which `GITHUB_TOKEN` can write to when the workflow runs
      #  in the fork's own context.
      - name: Login to GHCR for push
        if: ${{ needs.common_vars.outputs.selfhosted != '1' }}
        uses: docker/login-action@v4
        with:
          username: ${{ github.actor }}
          password: ${{ github.token }}
          registry: ghcr.io

      - name: Push base image to local registry
        if: ${{ needs.common_vars.outputs.selfhosted == '1' }}
        env:
          DOCKER_BASE_IMAGE: ${{ matrix.os.base_image }}
        run: |
          for attempt in 1 2 3; do
            docker push "$DOCKER_REGISTRY/$DOCKER_BASE_IMAGE" && exit 0
            echo "Retrying push after backoff, attempt $attempt failed"
            sleep 10
          done
          exit 1

      - name: Push main image to local registry
        env:
          DOCKER_IMAGE_NAME: ${{ needs.common_vars.outputs.image_prefix }}${{ matrix.os.display }}:${{ needs.common_vars.outputs.image_tag }}
        run: |
          for attempt in 1 2 3; do
            docker push "$DOCKER_IMAGE_NAME" && exit 0
            echo "Retrying push after backoff, attempt $attempt failed"
            sleep 10
          done
          exit 1

      - name: Create and push alternative tags
        if: ${{ matrix.os.extra_tags }}
        env:
          DOCKER_IMAGE_NAME: ${{ needs.common_vars.outputs.image_prefix }}${{ matrix.os.display }}:${{ needs.common_vars.outputs.image_tag }}
          DOCKER_TAGS: ${{ join(matrix.os.extra_tags, ' ') }}
        run: |
          for NAME in $DOCKER_TAGS; do
            TAG="$IMAGE_PREFIX$NAME:$IMAGE_TAG"
            docker image tag "$DOCKER_IMAGE_NAME" "$TAG"
            for attempt in 1 2 3; do
              docker push "$TAG" && break
              if [ "$attempt" = "3" ]; then exit 1; fi
              echo "Retrying push of $TAG after backoff, attempt $attempt failed"
              sleep 10
            done
          done

  #
  #  Stage 2: build the 'docker-cli' image on top of the 'self-hosted' image
  #  that stage 1 builds.  Stages 3+ run the 'docker-cli' image as the job
  #  container, so the 'docker-cli' image must be fresh before stages 3+
  #  start.
  #
  process-docker-cli:
    needs: [process-host-bases, common_vars]
    timeout-minutes: 15

    env:
      DOCKER_REGISTRY: ${{ needs.common_vars.outputs.docker_registry }}
      IMAGE_PREFIX: ${{ needs.common_vars.outputs.image_prefix }}
      IMAGE_TAG: ${{ needs.common_vars.outputs.image_tag }}

    runs-on: ${{ needs.common_vars.outputs.selfhosted == '1' && 'self-hosted' || 'ubuntu-latest' }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - parent_image: ${{ needs.common_vars.outputs.image_prefix }}self-hosted:${{ needs.common_vars.outputs.image_tag }}
            display: self-hosted-docker-cli
            publishes: true
            dockerfile: scripts/ci/docker/Dockerfile.docker-cli

    name: "${{ matrix.os.display }}"

    steps:

      - uses: actions/checkout@v6
        with:
          lfs: false

      - name: Login to internal Docker registry (read)
        if: ${{ needs.common_vars.outputs.selfhosted == '1' }}
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_REPO_USERNAME }}
          password: ${{ secrets.DOCKER_REPO_PASSWORD }}
          registry: ${{ env.DOCKER_REGISTRY }}

      #  A fork pushes to, and pulls from, the fork's own GitHub Container
      #  Registry (GHCR) namespace.  The automatic `GITHUB_TOKEN` can reach that
      #  namespace whenever the workflow runs in the fork's own context.
      - name: Login to GHCR (read)
        if: ${{ needs.common_vars.outputs.selfhosted != '1' }}
        uses: docker/login-action@v4
        with:
          username: ${{ github.actor }}
          password: ${{ github.token }}
          registry: ghcr.io

      - name: Pull parent image
        env:
          PARENT_IMAGE: ${{ matrix.os.parent_image }}
        run: |
          for attempt in 1 2 3; do
            docker pull "$PARENT_IMAGE" && exit 0
            echo "Retrying pull after backoff, attempt $attempt failed"
            sleep 10
          done
          exit 1

      #
      #  Layer cache stays enabled.  The nightly run rebuilds the parent image
      #  with `--no-cache`, which changes the parent image ID, and the new
      #  ID invalidates every layer of the 'docker-cli' image.
      #
      - name: Build derived image
        env:
          DOCKER_IMAGE_NAME: ${{ needs.common_vars.outputs.image_prefix }}${{ matrix.os.display }}:${{ needs.common_vars.outputs.image_tag }}
          DOCKERFILE: ${{ matrix.os.dockerfile }}
          PARENT_IMAGE: ${{ matrix.os.parent_image }}
        run: |
          for attempt in 1 2 3; do
            docker build -f "$DOCKERFILE" -t "$DOCKER_IMAGE_NAME" --build-arg "from=$PARENT_IMAGE" --label preserve=true . && exit 0
            echo "Retrying build after backoff, attempt $attempt failed"
            sleep 10
          done
          exit 1

      - name: Login to internal Docker registry for push
        if: ${{ needs.common_vars.outputs.selfhosted == '1' }}
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_REPO_UPDATE_USERNAME }}
          password: ${{ secrets.DOCKER_REPO_UPDATE_PASSWORD }}
          registry: ${{ env.DOCKER_REGISTRY }}

      #  A fork pushes to, and pulls from, the fork's own GitHub Container
      #  Registry (GHCR) namespace.  The automatic `GITHUB_TOKEN` can reach that
      #  namespace whenever the workflow runs in the fork's own context.
      - name: Login to GHCR for push
        if: ${{ needs.common_vars.outputs.selfhosted != '1' }}
        uses: docker/login-action@v4
        with:
          username: ${{ github.actor }}
          password: ${{ github.token }}
          registry: ghcr.io

      - name: Push derived image
        env:
          DOCKER_IMAGE_NAME: ${{ needs.common_vars.outputs.image_prefix }}${{ matrix.os.display }}:${{ needs.common_vars.outputs.image_tag }}
        run: |
          for attempt in 1 2 3; do
            docker push "$DOCKER_IMAGE_NAME" && exit 0
            echo "Retrying push after backoff, attempt $attempt failed"
            sleep 10
          done
          exit 1

  #
  #  Stage 3: refresh the remaining CI base images and the pull-through
  #  cache mirrors.  Stage 3 runs inside the dind sidecar plus the
  #  freshly built 'docker-cli' container.
  #
  process-ci-images:
    needs: [process-docker-cli, common_vars]
    timeout-minutes: 20

    env:
      DOCKER_REGISTRY: ${{ needs.common_vars.outputs.docker_registry }}
      IMAGE_PREFIX: ${{ needs.common_vars.outputs.image_prefix }}
      IMAGE_TAG: ${{ needs.common_vars.outputs.image_tag }}

    runs-on: ${{ needs.common_vars.outputs.selfhosted == '1' && 'self-hosted' || 'ubuntu-latest' }}

    services:
      dind:
        image: ${{ needs.common_vars.outputs.image_prefix }}self-hosted-docker-dind:${{ needs.common_vars.outputs.image_tag }}
        options: --privileged
        env:
          DOCKER_TLS_CERTDIR: ""
          NO_PROXY: "*.networkradius.com,127.0.0.1"
        volumes:
          - ${{ github.workspace }}:/workspace

    container:
      image: ${{ needs.common_vars.outputs.image_prefix }}self-hosted-docker-cli:${{ needs.common_vars.outputs.image_tag }}
      env:
        DOCKER_HOST: tcp://dind:2375
        NO_PROXY: dind,*.networkradius.com,127.0.0.1
      volumes:
        - /usr/local/share/ca-certificates/networkradius.com.crt:/usr/local/share/ca-certificates/networkradius.com.crt:ro
        - ${{ github.workspace }}:/workspace

    defaults:
      run:
        shell: bash
        working-directory: /workspace

    strategy:
      fail-fast: false
      matrix:
        os:
          #
          #  Slim build bases for `ci-rpm.yml` / `ci-deb.yml`.
          #  `scripts/docker/m4/ci.{rpm,deb}.m4` generates each `Dockerfile.ci`,
          #  so regenerate with `make dockerfile.ci` after editing the m4.
          #  The generated `Dockerfile.ci` hardcodes the per-distro `FROM`, so
          #  the matrix entries pass no `build_args`.
          #
          - base_image: rockylinux/rockylinux:9
            display: self-hosted-ci-rocky9
            publishes: true
            dockerfile: scripts/docker/build/rocky9/Dockerfile.ci

          - base_image: rockylinux/rockylinux:10
            display: self-hosted-ci-rocky10
            publishes: true
            dockerfile: scripts/docker/build/rocky10/Dockerfile.ci

          - base_image: debian:trixie
            display: self-hosted-ci-debian13
            publishes: true
            dockerfile: scripts/docker/build/debian13/Dockerfile.ci

          - base_image: debian:sid
            display: self-hosted-ci-debiansid
            publishes: true
            dockerfile: scripts/docker/build/debiansid/Dockerfile.ci

          - base_image: ubuntu:24.04
            display: self-hosted-ci-ubuntu24
            publishes: true
            dockerfile: scripts/docker/build/ubuntu24/Dockerfile.ci

          - base_image: ubuntu:26.04
            display: self-hosted-ci-ubuntu26
            publishes: true
            dockerfile: scripts/docker/build/ubuntu26/Dockerfile.ci

          - base_image: mariadb
            display: mariadb
          - base_image: postgres
            display: postgres
          - base_image: 4teamwork/389ds
            display: 4teamwork/389ds

    name: "${{ matrix.os.display }}"

    steps:

      - uses: actions/checkout@v6
        with:
          lfs: false

      - name: setup-dind
        uses: ./.github/actions/setup-dind

      #
      #  Authenticate dind to Docker Hub up front.  Every subsequent
      #  `docker pull` (and the implicit `FROM` pull that `docker build`
      #  triggers) then uses the higher per-user rate limit instead of the
      #  anonymous 100 pulls per 6 hours.  The `parent_image`-only entries
      #  skip the login, because a `parent_image`-only entry pulls from the
      #  internal registry instead.
      #
      - name: Login to Docker Hub (via dind)
        if: ${{ matrix.os.base_image && needs.common_vars.outputs.selfhosted == '1' }}
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_READ_USER }}
          password: ${{ secrets.DOCKERHUB_READ_KEY }}

      #
      #  Read-only login to the internal registry.  The login runs up
      #  front so a `parent_image` entry (cli) can pull the parent image
      #  before the build step.
      #
      - name: Login to internal Docker registry (read, via dind)
        if: ${{ needs.common_vars.outputs.selfhosted == '1' }}
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_REPO_USERNAME }}
          password: ${{ secrets.DOCKER_REPO_PASSWORD }}
          registry: ${{ env.DOCKER_REGISTRY }}

      #  A fork pushes to, and pulls from, the fork's own GitHub Container
      #  Registry (GHCR) namespace.  The automatic `GITHUB_TOKEN` can reach that
      #  namespace whenever the workflow runs in the fork's own context.
      - name: Login to GHCR (read, via dind)
        if: ${{ needs.common_vars.outputs.selfhosted != '1' }}
        uses: docker/login-action@v4
        with:
          username: ${{ github.actor }}
          password: ${{ github.token }}
          registry: ghcr.io

      #
      #  Pull the source image into dind.  `base_image` entries pull from
      #  Docker Hub and then re-tag the image to the internal registry namespace,
      #  so jobs that pull through the cache use the same name.
      #  `parent_image` entries pull from the internal registry directly.
      #
      - name: Pull source image
        env:
          DOCKER_BASE_IMAGE: ${{ matrix.os.base_image }}
          PARENT_IMAGE: ${{ matrix.os.parent_image }}
        run: |
          if [ -n "$PARENT_IMAGE" ]; then
            for attempt in 1 2 3; do
              docker pull "$PARENT_IMAGE" && exit 0
              echo "Retrying pull after backoff, attempt $attempt failed"
              sleep 10
            done
            exit 1
          fi
          for attempt in 1 2 3; do
            docker pull "$DOCKER_BASE_IMAGE" && break
            if [ "$attempt" = 3 ]; then exit 1; fi
            echo "Retrying pull after backoff, attempt $attempt failed"
            sleep 10
          done
          echo "FROM $DOCKER_BASE_IMAGE" | docker build --label preserve=true -t "$DOCKER_REGISTRY/$DOCKER_BASE_IMAGE" -

      #
      #  Generate `freeradius-build-deps*.deb` so the slim CI base images
      #  can apt-install the package list without pulling the full
      #  `build-essential` / `devscripts` toolchain at every CI run.  The
      #  step only matters for the deb-family CI bases that build
      #  FreeRADIUS.  The pull-through database caches, dind, and cli
      #  entries skip the step.
      #
      - name: Create build dependency package
        if: ${{ matrix.os.publishes && matrix.os.dockerfile && matrix.os.base_image }}
        env:
          DOCKER_BASE_IMAGE: ${{ matrix.os.base_image }}
        run: |
          cat > build-dep-pkg.sh << EOF
          apt-get update
          export DEBIAN_FRONTEND=noninteractive
          apt-get install -y --no-install-recommends build-essential devscripts equivs quilt
          cd /work
          debian/rules debian/control
          mk-build-deps debian/control
          mv freeradius-build-deps_*.deb freeradius-build-deps.deb
          mk-build-deps scripts/ci/extra-packages.debian.control
          mv freeradius-build-deps_1*.deb freeradius-build-deps-extra.deb
          chown $(stat -c'%u:%g' .git) *
          EOF
          chmod 755 build-dep-pkg.sh
          docker run \
            -v /workspace:/work \
            -w /work \
            --rm \
            "$DOCKER_BASE_IMAGE" \
            sh -c './build-dep-pkg.sh'

      #
      #  Stage the internal CA certificate into the build context for
      #  any matrix entry that sets `needs_internal_ca` (the dind sidecar
      #  image, which must trust 'docker.internal.networkradius.com').
      #
      - name: Stage registry mirror CA into build context
        if: ${{ matrix.os.needs_internal_ca && needs.common_vars.outputs.selfhosted == '1' }}
        run: |
          cp /usr/local/share/ca-certificates/networkradius.com.crt \
             scripts/ci/networkradius.com.crt

      #
      #  The "exporting to image" phase of `docker build` occasionally trips a
      #  transient, millisecond-scale lock race in the containerd
      #  snapshot store.  Three attempts with a short sleep absorb the
      #  race without masking real failures.
      #
      #  Log in before building.  The dind sidecar starts empty in every job,
      #  so the previous image pulled from the registry is the only layer
      #  cache that a build can have, and the job pushes the result with
      #  the same credentials.
      #
      - name: Login to internal Docker registry for push (via dind)
        if: ${{ needs.common_vars.outputs.selfhosted == '1' }}
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_REPO_UPDATE_USERNAME }}
          password: ${{ secrets.DOCKER_REPO_UPDATE_PASSWORD }}
          registry: ${{ env.DOCKER_REGISTRY }}

      #  A fork pushes to, and pulls from, the fork's own GitHub Container
      #  Registry (GHCR) namespace.  The automatic `GITHUB_TOKEN` can reach that
      #  namespace whenever the workflow runs in the fork's own context.
      - name: Login to GHCR for push (via dind)
        if: ${{ needs.common_vars.outputs.selfhosted != '1' }}
        uses: docker/login-action@v4
        with:
          username: ${{ github.actor }}
          password: ${{ github.token }}
          registry: ghcr.io

      - name: Build main Docker image
        if: ${{ matrix.os.publishes && matrix.os.dockerfile }}
        env:
          DOCKER_IMAGE_NAME: ${{ needs.common_vars.outputs.image_prefix }}${{ matrix.os.display }}:${{ needs.common_vars.outputs.image_tag }}
          DOCKER_CACHE_IMAGE: ${{ needs.common_vars.outputs.image_prefix }}${{ matrix.os.display }}:latest
          DOCKERFILE: ${{ matrix.os.dockerfile }}
          BUILD_ARGS_JSON: ${{ toJson(matrix.os.build_args) }}
        run: |
          build_args=()
          while IFS=$'\t' read -r key value; do
            [ -n "$key" ] && build_args+=(--build-arg "${key}=${value}")
          done < <(printf '%s' "$BUILD_ARGS_JSON" | jq -r 'to_entries[]? | [.key, .value] | @tsv')

          #  The previous image for the ref being built is the best cache,
          #  and the `latest` tag is the fallback for a ref building for the
          #  first time.  A pull
          #  that finds nothing means a cold build.
          docker pull "$DOCKER_IMAGE_NAME" 2>/dev/null || true
          docker pull "$DOCKER_CACHE_IMAGE" 2>/dev/null || true

          #  `BUILDKIT_INLINE_CACHE` embeds the cache metadata in the pushed
          #  image, without which a pulled image cannot seed the next build.
          for attempt in 1 2 3; do
            docker build -f "$DOCKERFILE" -t "$DOCKER_IMAGE_NAME" --label preserve=true \
              --cache-from "$DOCKER_IMAGE_NAME" --cache-from "$DOCKER_CACHE_IMAGE" \
              --build-arg BUILDKIT_INLINE_CACHE=1 \
              "${build_args[@]}" . && exit 0
            echo "Retrying build after backoff, attempt $attempt failed"
            sleep 10
          done
          exit 1

      #  Renaming the image fills the organisation's local copy of
      #  Docker Hub.  A fork keeps no local copy and fetches third-party
      #  images under plain upstream names, so a fork skips the rename.
      - name: Push base image to local registry
        if: ${{ matrix.os.base_image && needs.common_vars.outputs.selfhosted == '1' }}
        env:
          DOCKER_BASE_IMAGE: ${{ matrix.os.base_image }}
        run: |
          for attempt in 1 2 3; do
            docker push "$DOCKER_REGISTRY/$DOCKER_BASE_IMAGE" && exit 0
            echo "Retrying push after backoff, attempt $attempt failed"
            sleep 10
          done
          exit 1

      - name: Push main image to local registry
        if: ${{ matrix.os.publishes && matrix.os.dockerfile }}
        env:
          DOCKER_IMAGE_NAME: ${{ needs.common_vars.outputs.image_prefix }}${{ matrix.os.display }}:${{ needs.common_vars.outputs.image_tag }}
        run: |
          for attempt in 1 2 3; do
            docker push "$DOCKER_IMAGE_NAME" && exit 0
            echo "Retrying push after backoff, attempt $attempt failed"
            sleep 10
          done
          exit 1

      - name: Create and push alternative tags
        if: ${{ matrix.os.publishes && matrix.os.extra_tags }}
        env:
          DOCKER_IMAGE_NAME: ${{ needs.common_vars.outputs.image_prefix }}${{ matrix.os.display }}:${{ needs.common_vars.outputs.image_tag }}
          DOCKER_TAGS: ${{ join(matrix.os.extra_tags, ' ') }}
        run: |
          for TAG in $DOCKER_TAGS; do
            docker image tag "$DOCKER_IMAGE_NAME" "$TAG"
            for attempt in 1 2 3; do
              docker push "$TAG" && break
              if [ "$attempt" = "3" ]; then exit 1; fi
              echo "Retrying push of $TAG after backoff, attempt $attempt failed"
              sleep 10
            done
          done


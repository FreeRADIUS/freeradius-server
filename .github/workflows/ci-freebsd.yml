name: CI FreeBSD

on:
  workflow_call:

env:
  HOSTAPD_BUILD_DIR: eapol_test.ci
  HOSTAPD_GIT_TAG: hostap_2_12
  NO_PERFORMANCE_TESTS: yes

jobs:
  #
  #  The `common_vars` job provides the compiler version.  See
  #  `.github/workflows/common_vars.yml`.
  #
  common_vars:
    name: Common vars
    uses: ./.github/workflows/common_vars.yml

  freebsd-build:
    needs: common_vars

    runs-on: ubuntu-latest

    #
    #  The base system's clang on FreeBSD 15.1 is LLVM 19, so the job
    #  installs the LLVM release the other legs build with from packages,
    #  and names the versioned clang binary when configuring.
    #
    env:
      LLVM_VERSION: ${{ needs.common_vars.outputs.llvm_version }}

    name: "FreeBSD build"

    steps:

    # Checkout, but defer pulling the Git Large File Storage (LFS) objects
    # until the cache restore step below runs
    - uses: actions/checkout@v6
      with:
        lfs: false
        path: freeradius

    - name: Create LFS file list as cache key
      run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id
      working-directory: freeradius

    - name: Restore LFS cache
      uses: actions/cache@v5
      id: lfs-cache
      with:
        path: .git/lfs
        key: freebsd-lfs-${{ hashFiles('freeradius/.lfs-assets-id') }}-v1

    # The LFS pull reads local objects on a cache hit, and downloads the
    # objects from the remote on a miss
    - name: Git LFS pull
      run: git lfs pull
      working-directory: freeradius

    - name: Restore eapol_test build directory from cache
      uses: actions/cache@v5
      id: hostapd-cache
      with:
        path: ${{ env.HOSTAPD_BUILD_DIR }}
        key: hostapd-freebsd-${{ env.HOSTAPD_GIT_TAG }}-v5

    - name: Start a FreeBSD VirtualBox VM
      uses: cross-platform-actions/action@v1.4.0
      with:
        operating_system: freebsd
        version: '15.1'
        sync_files: runner-to-vm
        memory: 4G
        environment_variables: HOSTAPD_BUILD_DIR HOSTAPD_GIT_TAG NO_PERFORMANCE_TESTS LLVM_VERSION

    #
    #  The virtual machine (VM) stays up after the step above, and
    #  `shell: cpa.sh {0}` runs a step inside the VM.  The action's own
    #  `run:` input is deprecated in favour of the `cpa.sh` shell.
    #
    - name: Install dependencies (FreeBSD)
      shell: cpa.sh {0}
      run: |
        #
        #  A release's default package repository is the quarterly branch,
        #  and the quarterly branch for FreeBSD 15 stops at llvm22.  The
        #  latest branch carries the release that common_vars names.  The
        #  two blocks repeat the shape of the shipped /etc/pkg/FreeBSD.conf,
        #  because an override replaces a repository's whole block.  pkg
        #  expands ${ABI} itself, so the single quotes keep the shell away
        #  from the variable.
        #
        sudo mkdir -p /usr/local/etc/pkg/repos
        printf '%s\n' \
          'FreeBSD-ports: { url: "pkg+https://pkg.FreeBSD.org/${ABI}/latest", mirror_type: "srv", signature_type: "fingerprints", fingerprints: "/usr/share/keys/pkg", enabled: yes }' \
          'FreeBSD-ports-kmods: { url: "pkg+https://pkg.FreeBSD.org/${ABI}/kmods_latest", mirror_type: "srv", signature_type: "fingerprints", fingerprints: "/usr/share/keys/pkg", enabled: yes }' \
          | sudo tee /usr/local/etc/pkg/repos/FreeBSD.conf > /dev/null
        sudo pkg update
        sudo pkg upgrade -y
        sudo pkg install -y    \
          bash                 \
          brotli               \
          curl                 \
          cyrus-sasl           \
          freetds              \
          git                  \
          git-lfs              \
          gmake                \
          google-perftools     \
          hiredis              \
          json-c               \
          libidn               \
          libmemcached         \
          libpcap              \
          libyubikey           \
          llvm$LLVM_VERSION    \
          lua52                \
          mariadb-connector-c  \
          net-snmp             \
          openldap25-client    \
          python3              \
          py312-pip            \
          postgresql14-client  \
          sqlite3              \
          talloc               \
          unixODBC
        PIP_BREAK_SYSTEM_PACKAGES=1 pip install tacacs_plus
        echo "#! /bin/sh"        | sudo tee /usr/local/bin/nproc
        echo "sysctl -n hw.ncpu" | sudo tee -a /usr/local/bin/nproc
        sudo chmod +x /usr/local/bin/nproc
        if [ ! -f /bin/bash ]; then
          sudo ln -s /usr/local/bin/bash /bin/bash
        fi
        freebsd-version

    - name: Build FreeRADIUS (FreeBSD)
      shell: cpa.sh {0}
      run: |
        cd freeradius
        CC=clang$LLVM_VERSION ./configure
        gmake -j `nproc`

    - name: Run tests (FreeBSD)
      shell: cpa.sh {0}
      run: |
        cd freeradius
        gmake -j `nproc` test.keywords test.unit test.modules test.auth test.digest
        gmake -j `nproc` test

    #
    #  If the CI has failed and the branch is `ci-debug` then the workflow starts
    #  a tmate session to provide interactive shell access to the runner.
    #
    #  tmate prints the Secure Shell (SSH) rendezvous point continuously in the
    #  job output:
    #
    #      SSH: ssh VfuX8SrNuU5pGPMyZcz7TpJTa@sfo2.tmate.io
    #
    #  To use the session:
    #
    #    1. Push the failing commit: `git push origin ci-debug --force`
    #    2. Open the job output in https://github.com/FreeRADIUS/freeradius-server/actions
    #    3. Run the ssh command from the job output.
    #
    #  Access requires that you have the private key corresponding to the
    #  public key of the GitHub user that initiated the job.
    #
    #  The ssh command opens a shell into the MacOS environment on which
    #  the FreeBSD VM runs within VirtualBox.
    #
    #  Access the FreeBSD VM with:
    #
    #      ssh -t freebsd
    #
    #  The working directory is:
    #
    #      /User/runner/work
    #
    - name: "Debug: Start tmate"
      uses: mxschmitt/action-tmate@v3
      with:
        limit-access-to-actor: true
        repo-token: ${{ secrets.GITHUB_TOKEN }}
      if: ${{ github.ref == 'refs/heads/ci-debug' && failure() }}


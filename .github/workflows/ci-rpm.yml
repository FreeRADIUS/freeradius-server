name: CI RPM

on:
  workflow_call:

jobs:
  #
  #  Determines the values that turn on whether the run is happening in the
  #  FreeRADIUS organisation or in a fork.  See
  #  .github/workflows/common_vars.yml.
  #
  common_vars:
    uses: ./.github/workflows/common_vars.yml


  #
  #  We don't want to consume many workers on each push so we only build the
  #  full suite of distros during the scheduled or ci-debug run and just the
  #  "bleeding-edge" distro on each push.
  #
  #  This job builds the matrix based on the event that trigger this run which
  #  the next job consumes.
  #
  set-matrix:
    needs: common_vars
    name: Setup build matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
    - id: set-matrix
      name: Setup the matrix
      run: |
        if [ "$GITHUB_EVENT_NAME" = "schedule" -o "$GITHUB_REF" = "refs/heads/ci-debug" ]; then
          M=$(cat <<EOF
          {
            "env": [
              { "NAME": "rocky-9",  "OS": "rockylinux/rockylinux:9",  "BUILD_IMAGE": "${{ needs.common_vars.outputs.image_prefix }}self-hosted-ci-rocky9:${{ needs.common_vars.outputs.image_tag }}",  "DIST": "rocky", "VERSION": 9  },
              { "NAME": "rocky-10", "OS": "rockylinux/rockylinux:10", "BUILD_IMAGE": "${{ needs.common_vars.outputs.image_prefix }}self-hosted-ci-rocky10:${{ needs.common_vars.outputs.image_tag }}", "DIST": "rocky", "VERSION": 10 }
            ]
          }
        EOF
          )
        else
          M=$(cat <<EOF
          {
            "env": [
              { "NAME": "rocky-9",  "OS": "rockylinux/rockylinux:9",  "BUILD_IMAGE": "${{ needs.common_vars.outputs.image_prefix }}self-hosted-ci-rocky9:${{ needs.common_vars.outputs.image_tag }}",  "DIST": "rocky", "VERSION": 9 }
            ]
          }
        EOF
          )
        fi
        echo matrix=$M >> $GITHUB_OUTPUT


  rpm-build:

    needs:
      - set-matrix
      - common_vars

    strategy:
      matrix: ${{ fromJson(needs.set-matrix.outputs.matrix) }}
      fail-fast: false

    runs-on: ${{ needs.common_vars.outputs.selfhosted == '1' && 'self-hosted' || 'ubuntu-latest' }}

    container:
      image: ${{ matrix.env.BUILD_IMAGE }}

    env:
      HOSTAPD_BUILD_DIR: /tmp/eapol_test.ci
      HOSTAPD_GIT_TAG: hostap_2_11

    name: "RPM build"

    steps:
    - uses: actions/checkout@v6
      with:
        path: freeradius

    #
    #  The image bakes the builddep closure for the spec, refreshed when a
    #  packaging change lands on master.  A pull request that adds a
    #  dependency is testing a closure the image predates and cannot wait for
    #  its own merge, so top up from the checked-out spec in that case only.
    #  Run twice; occasionally dnf misses something first time round.
    #
    - name: Top up build dependencies from the spec
      if: ${{ needs.common_vars.outputs.images == 'true' }}
      run: |
        dnf builddep -y freeradius.spec && dnf builddep -y freeradius.spec
      working-directory: freeradius/redhat

    - name: Build RPMs
      run: |
        [ -r /opt/rh/gcc-toolset-14/enable ] && source /opt/rh/gcc-toolset-14/enable || :
        make rpm
      working-directory: freeradius

    - name: Collect RPMs
      run: |
        rm -rf rpms
        mkdir rpms
        mv freeradius/rpmbuild/RPMS/x86_64/*.rpm rpms

    - name: Restore eapol_test build directory from cache
      uses: actions/cache@v5
      id: hostapd-cache
      with:
        path: ${{ env.HOSTAPD_BUILD_DIR }}
        key: hostapd-${{ matrix.env.NAME }}-${{ env.HOSTAPD_GIT_TAG }}-v1

    # Build eapol_test using a minimal make environment to avoid configuring
    - name: Build eapol_test
      run: |
        [ -r /opt/rh/gcc-toolset-14/enable ] && source /opt/rh/gcc-toolset-14/enable || :
        scripts/ci/eapol_test-build.sh
        mv scripts/ci/eapol_test/eapol_test ../rpms
      working-directory: freeradius

    - name: Store RPMs
      uses: actions/upload-artifact@v6
      with:
        name: rpms-${{ matrix.env.NAME }}
        path: rpms
        retention-days: 1

    #
    #  If the CI has failed and the branch is ci-debug then start a tmate
    #  session. SSH rendezvous point is emited continuously in the job output.
    #
    - name: "Debug: Package dependancies for tmate"
      run: |
        ln -s /bin/true /bin/apt-get
      if: ${{ github.ref == 'refs/heads/ci-debug' && failure() }}

    - name: "Debug: Start tmate"
      uses: mxschmitt/action-tmate@v3
      with:
        limit-access-to-actor: true
        sudo: false
      if: ${{ github.ref == 'refs/heads/ci-debug' && failure() }}


  #
  #  Perform "post-install" testing of the FR packages that we have just built
  #  in a clean environment consisting of only the base OS and package
  #  dependancies
  #
  rpm-test:

    needs:
      - set-matrix
      - rpm-build
      - common_vars

    strategy:
      matrix: ${{ fromJson(needs.set-matrix.outputs.matrix) }}
      fail-fast: false

    runs-on: ${{ needs.common_vars.outputs.selfhosted == '1' && 'self-hosted' || 'ubuntu-latest' }}

    container:
      #
      #  rpm-test runs on a stock distro image so the install test exercises a
      #  clean operating system.  docker_prefix points the name at the copy
      #  the organisation keeps of that same image, put there by
      #  docker-refresh.yml, which is the identical image under another name
      #  and so leaves the clean-operating-system property intact.  Pulling
      #  the copy also keeps the organisation's build machines, which share a
      #  few outbound addresses, away from Docker Hub's allowance of 100
      #  downloads every six hours per address.
      #
      #  A fork has no such copy, so docker_prefix is empty and the name
      #  reaches Docker Hub unchanged.  GitHub-hosted machines spread over a
      #  large pool of addresses, so the allowance is not a problem there.
      #
      image: ${{ needs.common_vars.outputs.docker_prefix }}${{ matrix.env.OS }}

    name: "RPM install test"

    steps:
    - name: Set up NetworkRADIUS extras repository
      run: |
        echo '[networkradius-extras]'                                                               >  /etc/yum.repos.d/networkradius-extras.repo
        echo 'name=NetworkRADIUS-extras-$releasever'                                                >> /etc/yum.repos.d/networkradius-extras.repo
        echo 'baseurl=http://packages.networkradius.com/extras/${{ matrix.env.DIST }}/$releasever/' >> /etc/yum.repos.d/networkradius-extras.repo
        echo 'enabled=1'                                                                            >> /etc/yum.repos.d/networkradius-extras.repo
        echo 'gpgcheck=1'                                                                           >> /etc/yum.repos.d/networkradius-extras.repo
        echo 'gpgkey=https://packages.networkradius.com/pgp/packages@networkradius.com'             >> /etc/yum.repos.d/networkradius-extras.repo
        rpm --import https://packages.networkradius.com/pgp/packages@networkradius.com

    - name: Enable EPEL and CRB
      run: |
        dnf install -y dnf-utils dnf-plugins-core epel-release
        dnf config-manager --enable crb

    # For pkill
    - name: Enable procps-ng
      run: |
        dnf install -y procps-ng

    - name: Load RPMs
      uses: actions/download-artifact@v8
      with:
        name: rpms-${{ matrix.env.NAME }}

    - name: Install RPMs
      run: |
        dnf install -y *.rpm

    - name: Config check
      run: |
        radiusd -XC

    #
    #  We now perform some post-install tests that depend on the availability
    #  of the source tree
    #
    - name: Install pre-built eapol_test
      run: |
        dnf install -y libnl3 make gdb which
        mv eapol_test /usr/local/bin
        chmod +x /usr/local/bin/eapol_test

    - uses: actions/checkout@v6
      with:
        path: freeradius

    - name: Run the post-install test target
      run: |
        make -C raddb/certs Q=@
        touch Make.inc
        mkdir -p build/tests/eapol_test
        echo "EAPOL_TEST=" $(which eapol_test) > build/tests/eapol_test/eapol_test.mk
        make -f scripts/ci/package-test.mk package-test
      working-directory: freeradius

    #  This job checks out into freeradius/, so the action lives below that path
    #  and the collection runs from there.
    - name: Collect core dumps
      if: ${{ always() }}
      uses: ./freeradius/.github/actions/collect-core-dumps
      with:
        name: ${{ matrix.env.NAME }}
        working-directory: freeradius

    - name: Upload radius logs on failure
      if: ${{ failure() }}
      uses: actions/upload-artifact@v6
      with:
        name: radius-logs-${{ matrix.env.NAME }}
        path: |
          /var/log/radius
          freeradius/build/tests/eapol_test
        retention-days: 30

    #
    #  See above comments for tmate
    #
    - name: "Debug: Package dependancies for tmate"
      run: |
        dnf install -y xz
        ln -s /bin/true /bin/apt-get
      if: ${{ github.ref == 'refs/heads/ci-debug' && failure() }}

    - name: "Debug: Start tmate"
      uses: mxschmitt/action-tmate@v3
      with:
        limit-access-to-actor: true
        sudo: false
      if: ${{ github.ref == 'refs/heads/ci-debug' && failure() }}

name: CI RPM

on:
  workflow_call:

jobs:
  #
  #  The `common_vars` job emits different values depending on whether the run
  #  is occurring in the FreeRADIUS organisation or in a fork.  See
  #  `.github/workflows/common_vars.yml`.
  #
  common_vars:
    name: Common vars
    uses: ./.github/workflows/common_vars.yml


  #
  #  We do not want to consume many workers on each push.  We therefore
  #  build the full suite of distros only during the scheduled or
  #  `ci-debug` run, and build only the 'bleeding-edge' distro on each
  #  push.
  #
  #  `set-matrix` builds the matrix from the event that triggered the run,
  #  and `rpm-build` consumes the matrix.
  #
  set-matrix:
    needs: common_vars
    name: Setup build matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
    - id: set-matrix
      name: Setup the matrix
      run: |
        if [ "$GITHUB_EVENT_NAME" = "schedule" -o "$GITHUB_REF" = "refs/heads/ci-debug" ]; then
          M=$(cat <<EOF
          {
            "env": [
              { "NAME": "rocky-9",  "OS": "rockylinux/rockylinux:9",  "BUILD_IMAGE": "${{ needs.common_vars.outputs.image_prefix }}self-hosted-ci-rocky9:${{ needs.common_vars.outputs.image_tag }}",  "DIST": "rocky", "VERSION": 9  },
              { "NAME": "rocky-10", "OS": "rockylinux/rockylinux:10", "BUILD_IMAGE": "${{ needs.common_vars.outputs.image_prefix }}self-hosted-ci-rocky10:${{ needs.common_vars.outputs.image_tag }}", "DIST": "rocky", "VERSION": 10 }
            ]
          }
        EOF
          )
        else
          M=$(cat <<EOF
          {
            "env": [
              { "NAME": "rocky-9",  "OS": "rockylinux/rockylinux:9",  "BUILD_IMAGE": "${{ needs.common_vars.outputs.image_prefix }}self-hosted-ci-rocky9:${{ needs.common_vars.outputs.image_tag }}",  "DIST": "rocky", "VERSION": 9 },
              { "NAME": "rocky-10", "OS": "rockylinux/rockylinux:10", "BUILD_IMAGE": "${{ needs.common_vars.outputs.image_prefix }}self-hosted-ci-rocky10:${{ needs.common_vars.outputs.image_tag }}", "DIST": "rocky", "VERSION": 10 }
            ]
          }
        EOF
          )
        fi
        echo matrix=$M >> $GITHUB_OUTPUT


  rpm-build:

    needs:
      - set-matrix
      - common_vars

    strategy:
      matrix: ${{ fromJson(needs.set-matrix.outputs.matrix) }}
      fail-fast: false

    runs-on: ${{ needs.common_vars.outputs.selfhosted == '1' && 'self-hosted' || 'ubuntu-latest' }}

    container:
      image: ${{ matrix.env.BUILD_IMAGE }}


    name: "RPM build"

    steps:
    - uses: actions/checkout@v6
      with:
        path: freeradius

    #
    #  The continuous integration (CI) image includes the build
    #  dependencies for the spec.  The image refresh rebuilds the image
    #  when a packaging change lands on master.  A pull request's tests
    #  run on a docker image that does not include dependencies added in
    #  the pull request.  The refreshed image only arrives after the
    #  pull request merges.  The step therefore tops up the build
    #  dependencies from the checked-out spec, and the step runs only
    #  when the packaging changed.  The step runs `dnf builddep` twice,
    #  because dnf occasionally misses a package on the first run.
    #
    - name: Top up build dependencies from the spec
      if: ${{ needs.common_vars.outputs.images_changed == 'true' }}
      run: |
        dnf builddep -y freeradius.spec && dnf builddep -y freeradius.spec
      working-directory: freeradius/redhat

    - name: Build RPMs
      run: |
        [ -r /opt/rh/gcc-toolset-14/enable ] && source /opt/rh/gcc-toolset-14/enable || :
        make rpm
      working-directory: freeradius

    - name: Collect RPMs
      run: |
        rm -rf rpms
        mkdir rpms
        mv freeradius/rpmbuild/RPMS/x86_64/*.rpm rpms

    #  The CI image already has `eapol_test`.  The stock image that the
    #  install test uses has no `eapol_test`, so copy `eapol_test` into
    #  `rpms/` alongside the packages.  The install test moves
    #  `eapol_test` to `/usr/local/bin`, and `scripts/ci/package-test.mk`
    #  looks `eapol_test` up on `PATH`.
    - name: Stage eapol_test for the install test
      run: cp /usr/local/bin/eapol_test rpms/eapol_test

    - name: Store RPMs
      uses: actions/upload-artifact@v6
      with:
        name: rpms-${{ matrix.env.NAME }}
        path: rpms
        retention-days: 1

    #
    #  If the CI has failed and the branch is `ci-debug` then the workflow starts
    #  a tmate session.  See the tmate comment in `ci.yml` for the walkthrough.
    #
    - name: "Debug: Package dependencies for tmate"
      run: |
        ln -s /bin/true /bin/apt-get
      if: ${{ github.ref == 'refs/heads/ci-debug' && failure() }}

    - name: "Debug: Start tmate"
      uses: mxschmitt/action-tmate@v3
      with:
        limit-access-to-actor: true
        sudo: false
      if: ${{ github.ref == 'refs/heads/ci-debug' && failure() }}


  #
  #  `rpm-test` tests the FreeRADIUS packages that `rpm-build` just built,
  #  in a clean environment consisting of only the base operating system
  #  and the package dependencies.
  #
  rpm-test:

    needs:
      - set-matrix
      - rpm-build
      - common_vars

    strategy:
      matrix: ${{ fromJson(needs.set-matrix.outputs.matrix) }}
      fail-fast: false

    runs-on: ${{ needs.common_vars.outputs.selfhosted == '1' && 'self-hosted' || 'ubuntu-latest' }}

    container:
      #
      #  `rpm-test` runs on a stock distro image so the install test
      #  exercises a clean operating system.  `docker_prefix` points the
      #  image name at the copy of the stock image that the organisation
      #  keeps, and `docker-ci-images-refresh.yml` puts the copy in the
      #  organisation's registry.  The copy is the identical image under
      #  another name, so the operating system stays clean.  The
      #  organisation's build machines share a few outbound addresses.
      #  Pulling the copy also keeps the build machines away from Docker
      #  Hub's allowance of 100 downloads every six hours per address.
      #
      #  A fork keeps no copy of the stock image, so `docker_prefix` is
      #  empty and the image name reaches Docker Hub unchanged.  GitHub-hosted
      #  machines spread over a large pool of addresses, so the
      #  allowance is not a problem for GitHub-hosted machines.
      #
      image: ${{ needs.common_vars.outputs.docker_prefix }}${{ matrix.env.OS }}

    name: "RPM install test"

    steps:
    - name: Set up NetworkRADIUS extras repository
      run: |
        echo '[networkradius-extras]'                                                               >  /etc/yum.repos.d/networkradius-extras.repo
        echo 'name=NetworkRADIUS-extras-$releasever'                                                >> /etc/yum.repos.d/networkradius-extras.repo
        echo 'baseurl=http://packages.networkradius.com/extras/${{ matrix.env.DIST }}/$releasever/' >> /etc/yum.repos.d/networkradius-extras.repo
        echo 'enabled=1'                                                                            >> /etc/yum.repos.d/networkradius-extras.repo
        echo 'gpgcheck=1'                                                                           >> /etc/yum.repos.d/networkradius-extras.repo
        echo 'gpgkey=https://packages.networkradius.com/pgp/packages@networkradius.com'             >> /etc/yum.repos.d/networkradius-extras.repo
        rpm --import https://packages.networkradius.com/pgp/packages@networkradius.com

    - name: Enable EPEL and CRB
      run: |
        dnf install -y dnf-utils dnf-plugins-core epel-release
        dnf config-manager --enable crb

    # `procps-ng` provides `pkill`
    - name: Enable procps-ng
      run: |
        dnf install -y procps-ng

    - name: Load RPMs
      uses: actions/download-artifact@v8
      with:
        name: rpms-${{ matrix.env.NAME }}

    - name: Install RPMs
      run: |
        dnf install -y *.rpm

    - name: Config check
      run: |
        radiusd -XC

    #
    #  The steps below run post-install tests that depend on the source
    #  tree.
    #
    - name: Install pre-built eapol_test
      run: |
        dnf install -y libnl3 make gdb which
        mv eapol_test /usr/local/bin
        chmod +x /usr/local/bin/eapol_test

    - uses: actions/checkout@v6
      with:
        path: freeradius

    - name: Run the post-install test target
      run: |
        make -C raddb/certs Q=@
        touch Make.inc
        make -f scripts/ci/package-test.mk package-test
      working-directory: freeradius

    #  `rpm-test` checks out into `freeradius/`, so the `uses:` reference
    #  points below `freeradius/` and the collection step runs in
    #  `freeradius/`.
    - name: Collect core dumps
      if: ${{ always() }}
      uses: ./freeradius/.github/actions/collect-core-dumps
      with:
        name: ${{ matrix.env.NAME }}
        working-directory: freeradius

    - name: Upload radius logs on failure
      if: ${{ failure() }}
      uses: actions/upload-artifact@v6
      with:
        name: radius-logs-${{ matrix.env.NAME }}
        path: |
          /var/log/radius
          freeradius/build/tests/eapol_test
        retention-days: 30

    #
    #  See the tmate comment on the `rpm-build` job.
    #
    - name: "Debug: Package dependencies for tmate"
      run: |
        dnf install -y xz
        ln -s /bin/true /bin/apt-get
      if: ${{ github.ref == 'refs/heads/ci-debug' && failure() }}

    - name: "Debug: Start tmate"
      uses: mxschmitt/action-tmate@v3
      with:
        limit-access-to-actor: true
        sudo: false
      if: ${{ github.ref == 'refs/heads/ci-debug' && failure() }}

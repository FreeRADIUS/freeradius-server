name: Docker service images

on:
  workflow_call:
  workflow_dispatch:

env:
  CI: 1
  GH_ACTIONS: 1
  DEBIAN_FRONTEND: noninteractive
  APT_OPTS: "-y --no-install-recommends"

jobs:
  #
  #  The `common_vars` job determines which registry holds the continuous
  #  integration (CI) images.  A caller that already has the answer passes
  #  the answer down.  A run that someone starts by hand receives no inputs,
  #  so this job determines the answer instead.  See
  #  `.github/workflows/common_vars.yml`.
  #
  common_vars:
    name: Common vars
    uses: ./.github/workflows/common_vars.yml

  #
  #  Generate matrix based on docker directories.
  #
  gen-matrix:

    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.gen-matrix.outputs.matrix }}

    steps:

    - uses: actions/checkout@v6
      with:
        lfs: false

    - id: gen-matrix
      name: Generate matrix based on docker targets
      run: |
        cd scripts/docker/build
        M=$(ls | perl -n -e '{chomp; push @L,"\"$_\""} END{print "{\"env\":[{\"OS\":",join("},{\"OS\":",@L),"}]}"}')
        echo "Matrix: $M"
        echo matrix=$M >> $GITHUB_OUTPUT

  #
  #  The job runs on the FreeRADIUS organisation's own build machines, inside
  #  the 'self-hosted-docker-cli' image.  A second container, named
  #  'self-hosted-docker-dind', runs beside the job container and holds the
  #  docker daemon that builds the images.  The second container already
  #  fetches public images through the organisation's local copy of Docker
  #  Hub.  The second container already trusts the certificate authority (CA)
  #  that signs the organisation's registry.
  #
  #  Only the main repository builds the images.  The build publishes each
  #  image where the rest of continuous integration (CI) then reads the
  #  image, so a fork that rebuilt the images would gain nothing.  A
  #  GitHub-hosted machine also cannot reach the local copy of Docker Hub
  #  that the build needs.  `ci-pipeline.yml` skips this workflow on a fork.
  #  The `if:` below covers the one remaining case, where somebody starts this
  #  workflow by hand from a fork.
  #
  docker-selfhosted:
    needs:
      - gen-matrix
      - common_vars

    if: github.repository_owner == 'FreeRADIUS'

    runs-on: self-hosted

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.gen-matrix.outputs.matrix) }}

    env: ${{ matrix.env }}

    name: "v4.0.x-${{ matrix.env.OS }}"

    services:
      dind:
        #
        #  The custom dind image bakes in an `/etc/docker/daemon.json`
        #  that points at the internal NetworkRADIUS registry as a
        #  Docker Hub pull-through mirror.  The image already trusts
        #  the internal CA.
        #
        image: ${{ needs.common_vars.outputs.image_prefix }}self-hosted-docker-dind:${{ needs.common_vars.outputs.image_tag }}
        options: --privileged
        env:
          DOCKER_TLS_CERTDIR: ""
          #  Bypass the squid proxy for internal registry access.
          NO_PROXY: "*.networkradius.com,127.0.0.1"
        #
        #  The volume shares the runner's workspace with dind, so
        #  the build context (`Dockerfile` + `COPY` sources) resolves
        #  to real files inside the dind daemon.
        #
        #  `github.workspace` is the HOST path to the workspace. The
        #  runner mounts the workspace into the job container at a
        #  different path (`/__w/...`), so we use a fixed mount point
        #  (`/workspace`) that names the same directory in both
        #  containers.
        #
        volumes:
          - ${{ github.workspace }}:/workspace

    container:
      #
      #  The custom CI image bakes the docker command line interface
      #  (CLI), buildx and m4 on top of the self-hosted base.
      #
      image: ${{ needs.common_vars.outputs.image_prefix }}self-hosted-docker-cli:${{ needs.common_vars.outputs.image_tag }}
      env:
        DOCKER_HOST: tcp://dind:2375
        NO_PROXY: dind,*.networkradius.com,127.0.0.1
      #  The CA certificate mount lets the in-container apt and curl
      #  connect over HTTPS to the internal registry. The second
      #  volume shares the workspace with dind, as the dind `volumes:`
      #  comment above describes.
      volumes:
        - /usr/local/share/ca-certificates/networkradius.com.crt:/usr/local/share/ca-certificates/networkradius.com.crt:ro
        - ${{ github.workspace }}:/workspace

    defaults:
      run:
        working-directory: /workspace

    steps:

    - uses: actions/checkout@v6
      with:
        fetch-depth: 1
        lfs: false

    - name: setup-dind
      uses: ./.github/actions/setup-dind

    #
    #  Authenticate dind to Docker Hub. 'self-hosted-docker-dind'
    #  bakes in `registry-mirrors` -> the internal registry, but the
    #  internal registry is not actually a Docker Hub pull-through
    #  cache. A `FROM` line like `ubuntu:24.04` inside the build falls
    #  back to 'docker.io' and would otherwise hit anonymous rate
    #  limits.
    #
    - name: Login to Docker Hub (via dind)
      uses: docker/login-action@v4
      with:
        username: ${{ vars.DOCKERHUB_READ_USER }}
        password: ${{ secrets.DOCKERHUB_READ_KEY }}

    #
    #  Authenticate dind to the internal registry so the push steps
    #  below can publish service + profiling images. The host docker
    #  daemon is logged in via the runner's `job-started` hook, but
    #  dind is a separate daemon with no auth config.
    #
    - name: Login to internal Docker registry (via dind)
      env:
        DOCKER_USERNAME: ${{ secrets.DOCKER_REPO_USERNAME }}
        DOCKER_PASSWORD: ${{ secrets.DOCKER_REPO_PASSWORD }}
      run: |
        echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin https://${{ needs.common_vars.outputs.docker_registry }}/

    - name: Verify Dockerfiles match m4 templates
      run: |
        make dockerfile.service.check
        make dockerfile.profiling.check

    #
    #  Build service + profiling images for this distro. Profiling
    #  `FROM`s the crossbuild image of the same distro, so the
    #  profiling build rule depends on the crossbuild stamp, which
    #  the 'freeradius4-crossbuild' push in `docker-crossbuild.yml`
    #  covers.
    #
    #  Setting `DOCKER_REGISTRY` makes `docker.mk` pull from the
    #  registry any base image (crossbuild) that is not yet local,
    #  instead of rebuilding the base image, per the pull-through
    #  fallback in `scripts/docker/docker.mk`.
    #
    #  The registry also holds a published 'service' image, so the
    #  same pull-through would satisfy `docker.service.$OS` without
    #  building anything and the smoke build would prove nothing.
    #  `NOPULL=1` on that call forces the build from the checkout.
    #  The 'profiling' call keeps the pull so the toolchain layers
    #  come from the registry.  Nothing publishes a 'profiling'
    #  image, so the 'profiling' layer itself builds locally.
    #
    - name: Build docker images
      env:
        DOCKER_REGISTRY: ${{ needs.common_vars.outputs.docker_registry }}
        DOCKER_REMOTE_PREFIX: ${{ needs.common_vars.outputs.image_prefix }}
        DOCKER_REMOTE_TAG: ${{ needs.common_vars.outputs.image_tag }}
      run: |
        NOPULL=1 make docker.service.$OS
        make docker.profiling.$OS

    #
    #  No push step here. `docker-ci-images-refresh.yml` publishes
    #  the service + profiling images on a periodic schedule. This
    #  workflow is a per-commit smoke build only, and confirms that
    #  the `Dockerfile` chain still builds. The built `:<sha>` tags
    #  disappear when the runner tears down the per-job dind sidecar.

    - name: Show docker build log
      if: failure()
      run: |
        cat build/docker/build.$OS.service 2>/dev/null || true
        cat build/docker/build.$OS.profiling 2>/dev/null || true

    #
    #  If the CI has failed and the branch is `ci-debug` then the workflow starts
    #  a tmate session.  See the tmate comment in `ci.yml` for the walkthrough.
    #
    - name: "Debug: Start tmate"
      uses: mxschmitt/action-tmate@v3
      with:
        limit-access-to-actor: true
      if: ${{ github.ref == 'refs/heads/ci-debug' && failure() }}

name: Close support questions

#
#  The issue tracker is for bugs.  Support questions go to the mailing lists,
#  so triage labels a support question "close" and this closes the issue with
#  a pointer to the lists.  The "labeled" trigger is what makes that work:
#  the label lands after the issue is opened, not with it.
#
on:
  issues:
    types: [opened, labeled]

jobs:
  close-support-questions:
    name: Close support questions
    if: contains(github.event.issue.labels.*.name, 'close')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Close Issue
        uses: peter-evans/close-issue@v3.0.2
        with:
          comment: Direct questions about server operation or development to the FreeRADIUS mailing lists https://freeradius.org/support/.

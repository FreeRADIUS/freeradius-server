name: Claude Code Review

#
#  The workflow uses `pull_request_target` rather than `pull_request`.  GitHub
#  never grants the `id-token` permission to a fork's `pull_request` run, so the
#  Anthropic authentication failed on every pull request from a fork.  The
#  target event runs in the base repository's context with real permissions.
#  The checkout below stays on the base branch, and the review reads the
#  pull request through the GitHub application programming interface (API).
#  No code from the fork therefore runs here.  The job condition below
#  limits automatic review to pull requests whose author has an
#  `author_association` of `OWNER`, `MEMBER`, `COLLABORATOR`, or
#  `CONTRIBUTOR`, or whose branch is in the FreeRADIUS repository.  The
#  workflow reviews any other pull request only when a maintainer adds
#  the 'claude-review' label.
#
on:
  pull_request_target:
    types: [opened, synchronize, ready_for_review, reopened, labeled]

jobs:
  claude-review:
    # Review pull requests from authors with previous contributions (or write
    # access) automatically.
    # `author_association` only reports `MEMBER` when the membership is public, so
    # a branch pushed to the organisation's own repository also qualifies.
    # Only someone with write access to the organisation can create such a
    # branch.
    # For first-time contributors and one-off pull requests, a maintainer must
    # add the 'claude-review' label to trigger a review.
    if: |
      (github.event.action != 'labeled' &&
       (contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR", "CONTRIBUTOR"]'), github.event.pull_request.author_association) ||
        github.event.pull_request.head.repo.owner.login == 'FreeRADIUS')) ||
      (github.event.action == 'labeled' && github.event.label.name == 'claude-review')

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_federation_rule_id: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          anthropic_organization_id: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          anthropic_service_account_id: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          anthropic_workspace_id: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options


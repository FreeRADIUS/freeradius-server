name: CI DEB

on:
  workflow_call:

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  #
  #  Determines the values that turn on whether the run is happening in the
  #  FreeRADIUS organisation or in a fork.  See
  #  .github/workflows/common_vars.yml.
  #
  common_vars:
    uses: ./.github/workflows/common_vars.yml


  #
  #  We don't want to consume many workers on each push so we only build the
  #  full suite of distros during the scheduled or ci-debug run and just the
  #  "bleeding-edge" distro on each push.
  #
  #  This job builds the matrix based on the event that trigger this run which
  #  the next job consumes.
  #
  set-matrix:
    needs: common_vars
    name: Setup build matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
    - id: set-matrix
      name: Setup the matrix
      run: |
        if [ "$GITHUB_EVENT_NAME" = "schedule" -o "$GITHUB_REF" = "refs/heads/ci-debug" ]; then
          M=$(cat <<EOF
          {
            "env": [
              { "NAME": "ubuntu-24.04", "OS": "ubuntu:24.04",    "BUILD_IMAGE": "${{ needs.common_vars.outputs.image_prefix }}self-hosted-ci-ubuntu24:${{ needs.common_vars.outputs.image_tag }}"   },
              { "NAME": "ubuntu-26.04", "OS": "ubuntu:26.04",    "BUILD_IMAGE": "${{ needs.common_vars.outputs.image_prefix }}self-hosted-ci-ubuntu26:${{ needs.common_vars.outputs.image_tag }}"   },
              { "NAME": "debian-13",    "OS": "debian:trixie",   "BUILD_IMAGE": "${{ needs.common_vars.outputs.image_prefix }}self-hosted-ci-debian13:${{ needs.common_vars.outputs.image_tag }}"   },
              { "NAME": "debian-sid",   "OS": "debian:sid",      "BUILD_IMAGE": "${{ needs.common_vars.outputs.image_prefix }}self-hosted-ci-debiansid:${{ needs.common_vars.outputs.image_tag }}"  }
            ]
          }
        EOF
          )
        else
          M=$(cat <<EOF
          {
            "env": [
              { "NAME": "debian-13",    "OS": "debian:trixie",   "BUILD_IMAGE": "${{ needs.common_vars.outputs.image_prefix }}self-hosted-ci-debian13:${{ needs.common_vars.outputs.image_tag }}" }
            ]
          }
        EOF
          )
        fi
        echo matrix=$M >> $GITHUB_OUTPUT


  deb-build:

    needs:
      - set-matrix
      - common_vars

    strategy:
      matrix: ${{ fromJson(needs.set-matrix.outputs.matrix) }}
      fail-fast: false

    runs-on: ${{ needs.common_vars.outputs.selfhosted == '1' && 'self-hosted' || 'ubuntu-latest' }}

    container:
      image: ${{ matrix.env.BUILD_IMAGE }}

    env:
      HOSTAPD_BUILD_DIR: /tmp/eapol_test.ci
      HOSTAPD_GIT_TAG: hostap_2_11

    name: "DEB build"

    steps:

    - uses: actions/checkout@v6
      with:
        path: freeradius

    #
    #  Top-up build-deps against the just-checked-out debian/control in
    #  case the image was baked before a recent control change. No-op
    #  when the image is current.
    #
    #
    #  The image bakes in the build-dep closure, refreshed when a packaging
    #  change lands on master.  A pull request that adds a dependency is
    #  testing a closure the image predates and cannot wait for its own merge,
    #  so top up from the checked-out control file in that case only.
    #
    - name: Top up build dependencies from debian/control
      if: ${{ needs.common_vars.outputs.images_changed == 'true' }}
      run: |
        touch -t 202001010000 debian/control
        debian/rules debian/control
        mk-build-deps -irt"apt-get -y --no-install-recommends" debian/control
      working-directory: freeradius

    - name: Build DEBs
      run: |
        make deb
      working-directory: freeradius

    - name: Collect DEBs
      run: |
        rm -rf debs
        mkdir debs
        mv *.deb debs

    - name: Restore eapol_test build directory from cache
      uses: actions/cache@v5
      id: hostapd-cache
      with:
        path: ${{ env.HOSTAPD_BUILD_DIR }}
        key: hostapd-${{ matrix.env.NAME }}-${{ env.HOSTAPD_GIT_TAG }}-v1

    # Build eapol_test using a minimal make environment to avoid configuring
    - name: Build eapol_test
      run: |
        scripts/ci/eapol_test-build.sh
        mv scripts/ci/eapol_test/eapol_test ../debs
      working-directory: freeradius

    - name: Store DEBs
      uses: actions/upload-artifact@v6
      with:
        name: debs-${{ matrix.env.NAME }}
        path: debs
        retention-days: 1

    #
    #  If the CI has failed and the branch is ci-debug then start a tmate
    #  session. SSH rendezvous point is emited continuously in the job output.
    #
    - name: "Debug: Start tmate"
      uses: mxschmitt/action-tmate@v3
      with:
        limit-access-to-actor: true
        sudo: false
      if: ${{ github.ref == 'refs/heads/ci-debug' && failure() }}


  #
  #  Perform "post-install" testing of the FR packages that we have just built
  #  in a clean environment consisting of only the base OS and package
  #  dependancies
  #
  deb-test:

    needs:
      - set-matrix
      - deb-build
      - common_vars

    strategy:
      matrix: ${{ fromJson(needs.set-matrix.outputs.matrix) }}
      fail-fast: false

    runs-on: ${{ needs.common_vars.outputs.selfhosted == '1' && 'self-hosted' || 'ubuntu-latest' }}

    container:
      #
      #  deb-test runs on a stock distro image so the install test exercises a
      #  clean operating system.  docker_prefix points the name at the copy
      #  the organisation keeps of that same image, put there by
      #  docker-refresh.yml, which is the identical image under another name
      #  and so leaves the clean-operating-system property intact.  Pulling
      #  the copy also keeps the organisation's build machines, which share a
      #  few outbound addresses, away from Docker Hub's allowance of 100
      #  downloads every six hours per address.
      #
      #  A fork has no such copy, so docker_prefix is empty and the name
      #  reaches Docker Hub unchanged.  GitHub-hosted machines spread over a
      #  large pool of addresses, so the allowance is not a problem there.
      #
      image: ${{ needs.common_vars.outputs.docker_prefix }}${{ matrix.env.OS }}

    name: "DEB install test"

    steps:

    - name: Load DEBs
      uses: actions/download-artifact@v8
      with:
        name: debs-${{ matrix.env.NAME }}

    - name: Package manager performance and stability improvements
      run: |
        if [ -f "/etc/apt/sources.list" ]; then
        sed -i 's/deb.debian.org/debian-archive.trafficmanager.net/' /etc/apt/sources.list
        sed -i 's/archive.ubuntu.com/azure.archive.ubuntu.com/' /etc/apt/sources.list
        fi
        echo 'Acquire::Retries "10";' > /etc/apt/apt.conf.d/80-retries
        echo 'force-unsafe-io' > /etc/dpkg/dpkg.cfg.d/02speedup
        echo 'man-db man-db/auto-update boolean false' | debconf-set-selections
        apt-get update

    # procps for pkill, curl+gnupg2 for apt-key, ca-certificates for curl
    - name: Install system utilities
      run: |
        apt-get install -y --no-install-recommends procps curl gnupg2 ca-certificates lsb-release

    - name: NetworkRADIUS signing key
      run: |
        install -d -o root -g root -m 0755 /etc/apt/keyrings
        curl -s 'https://packages.inkbridgenetworks.com/pgp/packages.networkradius.com.asc' | tee /etc/apt/keyrings/packages.networkradius.com.asc > /dev/null

    - name: Set up NetworkRADIUS extras repository
      run: |
        DIST=$(lsb_release -is | tr '[:upper:]' '[:lower:]')
        RELEASE=$(lsb_release -cs)
        if [ "$RELEASE" = "n/a" ]; then
            RELEASE=$(cat /etc/debian_version | awk -F \/ '{ print $(NF) }')
        fi
        [ "$RELEASE" != "forky" ] || RELEASE=sid
        echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/packages.networkradius.com.asc] http://packages.networkradius.com/extras/${DIST}/${RELEASE} ${RELEASE} main" \
          > /etc/apt/sources.list.d/networkradius-extras.list

    - name: Update apt repository lists
      run: apt-get update

    - name: Install DEBs
      run: |
        find . -maxdepth 1 -name '*.deb' | xargs apt-get install -y --no-install-recommends

    - name: Config test
      run: |
        freeradius -XC

    #
    #  We now perform some post-install tests that depend on the availability
    #  of the source tree
    #
    - name: Install pre-built eapol_test
      run: |
        apt-get install -y libssl1.? libdbus-1-? libnl-3-200 libnl-genl-3-200
        mv eapol_test /usr/local/bin
        chmod +x /usr/local/bin/eapol_test

    - uses: actions/checkout@v6
      with:
        path: freeradius

    - name: Run the post-install test target
      run: |
        make -C raddb/certs Q=@
        touch Make.inc
        mkdir -p build/tests/eapol_test
        echo "EAPOL_TEST=" $(which eapol_test) > build/tests/eapol_test/eapol_test.mk
        make -f scripts/ci/package-test.mk package-test
      working-directory: freeradius

    #  This job checks out into freeradius/, so the action lives below that path
    #  and the collection runs from there.
    - name: Collect core dumps
      if: ${{ always() }}
      uses: ./freeradius/.github/actions/collect-core-dumps
      with:
        name: ${{ matrix.env.NAME }}
        working-directory: freeradius

    - name: Upload radius logs on failure
      if: ${{ failure() }}
      uses: actions/upload-artifact@v6
      with:
        name: radius-logs-${{ matrix.env.NAME }}
        path: |
          /var/log/freeradius
          freeradius/build/tests/eapol_test
        retention-days: 30

    #
    #  See above comments for tmate
    #
    - name: "Debug: Package dependancies for tmate"
      run: |
        apt-get install -y --no-install-recommends xz-utils
      if: ${{ github.ref == 'refs/heads/ci-debug' && failure() }}

    - name: "Debug: Start tmate"
      uses: mxschmitt/action-tmate@v3
      with:
        limit-access-to-actor: true
        sudo: false
      if: ${{ github.ref == 'refs/heads/ci-debug' && failure() }}

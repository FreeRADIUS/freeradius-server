name: Docker crossbuild images

on:
  workflow_call:
  workflow_dispatch:

env:
  CI: 1
  GH_ACTIONS: 1
  DEBIAN_FRONTEND: noninteractive
  APT_OPTS: "-y --no-install-recommends"

jobs:
  #
  #  Determines which registry holds the continuous integration (CI) images.
  #  A caller that already has the answer passes the answer down.  A run that
  #  someone starts by hand receives no inputs, so this job determines the
  #  answer instead.  See .github/workflows/common_vars.yml.
  #
  common_vars:
    name: Common vars
    uses: ./.github/workflows/common_vars.yml

  #
  #  Generate matrix based on crossbuild docker directories.
  #
  gen-matrix:

    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.gen-matrix.outputs.matrix }}

    steps:

    - uses: actions/checkout@v6
      with:
        lfs: false

    - id: gen-matrix
      name: Generate matrix based on crossbuild targets
      run: |
        cd scripts/docker/build
        M=$(ls | perl -n -e '{chomp; push @L,"\"$_\""} END{print "{\"env\":[{\"OS\":",join("},{\"OS\":",@L),"}]}"}')
        echo "Matrix: $M"
        echo matrix=$M >> $GITHUB_OUTPUT

  #
  #  Runs on the FreeRADIUS organisation's own build machines, inside the
  #  self-hosted-docker-cli image.  A second container runs alongside, named
  #  self-hosted-docker-dind, and holds the docker daemon that does the actual
  #  building.  That second container already fetches public images through
  #  the organisation's local copy of Docker Hub, and already trusts the
  #  certificate authority (CA) the organisation signs its own registry with.
  #
  #  Only the main repository builds these images.  The build publishes each
  #  image where the rest of continuous integration (CI) then reads it, so a
  #  fork that rebuilt the images would gain nothing, and a
  #  GitHub-hosted machine cannot reach the local copy of Docker Hub that the
  #  build expects.  ci-pipeline.yml skips this workflow on a fork.  The if:
  #  below covers the one remaining case, somebody starting this workflow by
  #  hand from a fork.
  #
  crossbuild-selfhosted:
    needs:
      - gen-matrix
      - common_vars

    if: github.repository_owner == 'FreeRADIUS'

    runs-on: self-hosted

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.gen-matrix.outputs.matrix) }}

    env: ${{ matrix.env }}

    name: "${{ github.workflow }}-${{ matrix.env.OS }}"

    services:
      dind:
        #
        #  Custom dind image with /etc/docker/daemon.json baked in
        #  pointing at the internal NR registry as a Docker Hub
        #  pull-through mirror, and the internal CA pre-trusted.
        #
        image: ${{ needs.common_vars.outputs.image_prefix }}self-hosted-docker-dind:${{ needs.common_vars.outputs.image_tag }}
        options: --privileged
        env:
          DOCKER_TLS_CERTDIR: ""
          #  Bypass the squid proxy for internal registry access.
          NO_PROXY: "*.networkradius.com,127.0.0.1"
        #
        #  Share the runner's workspace with dind so the build
        #  context resolves to real files inside the dind daemon
        #  and the inner `docker run --mount=type=bind,source=...`
        #  bind-mount of the source tree resolves the same way in
        #  both containers.
        #
        #  github.workspace is the HOST path to the workspace. The
        #  runner mounts it into the job container at a different
        #  path (/__w/...), so we use a fixed mount point
        #  (/workspace) that both containers agree on.
        #
        volumes:
          - ${{ github.workspace }}:/workspace

    container:
      #
      #  Custom CI image with docker CLI / buildx / m4 baked on top
      #  of the self-hosted base.
      #
      image: ${{ needs.common_vars.outputs.image_prefix }}self-hosted-docker-cli:${{ needs.common_vars.outputs.image_tag }}
      env:
        DOCKER_HOST: tcp://dind:2375
        NO_PROXY: dind,*.networkradius.com,127.0.0.1
      #  CA cert mount lets the in-container apt and curl talk HTTPS
      #  to the internal registry. Shared workspace - see
      #  dind volumes comment above.
      volumes:
        - /usr/local/share/ca-certificates/networkradius.com.crt:/usr/local/share/ca-certificates/networkradius.com.crt:ro
        - ${{ github.workspace }}:/workspace

    defaults:
      run:
        working-directory: /workspace

    steps:

    - uses: actions/checkout@v6
      with:
        fetch-depth: 0${{ ( matrix.env.OS != 'centos7' ) && '1' }}
        lfs: false

    - name: setup-dind
      uses: ./.github/actions/setup-dind

    #
    #  The dind sidecar has its own dockerd that's not pre-authenticated
    #  to the internal registry (the host docker daemon on
    #  the self-hosted runner is, via the runner's job-started hook,
    #  but that auth doesn't propagate into the dind container). Log in
    #  explicitly so the inner crossbuild's FROM-pull of self-hosted-*
    #  works instead of 401-ing.
    #
    - name: Login to internal Docker registry (via dind)
      env:
        DOCKER_USERNAME: ${{ secrets.DOCKER_REPO_USERNAME }}
        DOCKER_PASSWORD: ${{ secrets.DOCKER_REPO_PASSWORD }}
      run: |
        echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin https://${{ needs.common_vars.outputs.docker_registry }}/

    #
    #  Run the per-distro crossbuild. CB_FROM_<distro> overrides the
    #  `from` build-arg in scripts/docker/crossbuild.mk so the inner
    #  docker build FROMs an internal base image instead of docker.io,
    #  killing the Hub pull (and the anonymous rate-limit headache) on
    #  every CI run. Local `make crossbuild.<distro>` ignores these
    #  and uses the upstream image baked into Dockerfile.crossbuild by m4.
    #
    - name: Run crossbuild tests
      env:
        CB_FROM_debian13:  ${{ needs.common_vars.outputs.image_prefix }}self-hosted-ci-debian13:${{ needs.common_vars.outputs.image_tag }}
        CB_FROM_debiansid: ${{ needs.common_vars.outputs.image_prefix }}self-hosted-ci-debiansid:${{ needs.common_vars.outputs.image_tag }}
        CB_FROM_ubuntu24:  ${{ needs.common_vars.outputs.image_prefix }}self-hosted-ci-ubuntu24:${{ needs.common_vars.outputs.image_tag }}
        CB_FROM_ubuntu26:  ${{ needs.common_vars.outputs.image_prefix }}self-hosted-ci-ubuntu26:${{ needs.common_vars.outputs.image_tag }}
        CB_FROM_rocky9:    ${{ needs.common_vars.outputs.image_prefix }}self-hosted-ci-rocky9:${{ needs.common_vars.outputs.image_tag }}
        CB_FROM_rocky10:   ${{ needs.common_vars.outputs.image_prefix }}self-hosted-ci-rocky10:${{ needs.common_vars.outputs.image_tag }}
      run: |
        make dockerfile.crossbuild.check
        make crossbuild.$OS

    #
    #  No push step here. crossbuild is published by
    #  docker-ci-images-refresh.yml on its periodic schedule. This workflow is
    #  a per-commit sanity test - it builds crossbuild and runs FR's
    #  in-container test suite against the working source, then the
    #  per-job dind sidecar tears down with the :<sha> image inside.

    - name: Show build log
      if: ${{ success() || failure() }}
      run: |
        cat build/docker/build.$OS.crossbuild

    - name: Show configure log
      if: ${{ success() || failure() }}
      run: |
        cat build/docker/configure.$OS.crossbuild

    - name: Show test log
      if: ${{ success() || failure() }}
      run: |
        cat build/docker/test.$OS.crossbuild

    #
    #  If the CI has failed and the branch is ci-debug then start a tmate
    #  session. SSH rendezvous point is emited continuously in the job output.
    #
    - name: "Debug: Start tmate"
      uses: mxschmitt/action-tmate@v3
      with:
        limit-access-to-actor: true
      if: ${{ github.ref == 'refs/heads/ci-debug' && failure() }}

name: Dockerhub Releases

#
#  Build and push multi-arch Docker images to the freeradius Dockerhub
#  repository when a new release tag is pushed.
#

on:

#
#  Rebuild when manually triggered (github.ref_name == v3.2.x)
#
  workflow_dispatch:
    inputs:
      tag:
        description: "Git 'release_' tag"
        required: false
        type: string
        default: 'latest'

      repo:
        description: "Dockerhub repository"
        required: true
        type: choice
        options:
          - freeradius
          - freeradius-test
        default: "freeradius-test"

      do_build:
        description: "Build images"
        type: boolean
        default: true

      do_manifests:
        description: "Build manifests"
        type: boolean
        default: true

      update_latest:
        description: "Update latest tags"
        type: boolean
        default: false

#
#  Rebuild on new release tag (github.ref_name = release_3_2_...)
#
#  We don't currently do this, but may add it in future. There are risks such
#  as if an old tag is pushed and not wanting to accidentally update the
#  'latest' docker images.
#
#  push:
#    tags:
#      - 'release_3_2_*'



# Don't run more than one build at the same time
concurrency:
  group: dockerhub-releases-v3.2.x


env:
  DOCKER_REPOSITORY_DEFAULT: "freeradius-test"
  BRANCH: v3.2.x
  CI: 1
  GH_ACTIONS: 1
  DEBIAN_FRONTEND: noninteractive
  APT_OPTS: "-y --no-install-recommends"


jobs:

  #
  #  Get the git tag to build and the docker repo to push to
  #
  get_build_info:
    runs-on: ubuntu-latest

    outputs:
      git_tag: ${{ steps.find-tag.outputs.tag }}
      version: ${{ steps.find-tag.outputs.version }}
      docker_repo: ${{ steps.docker-repo.outputs.repo }}
      do_build: ${{ steps.flags.outputs.build }}
      do_manifests: ${{ steps.flags.outputs.manifest }}
      update_latest: ${{ steps.flags.outputs.latest }}

    steps:

    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
        lfs: false

    - id: find-tag
      name: Find correct git tag to build
      run: |
        TAG="${{ inputs.tag }}"
        if [ -z "$TAG" -o "$TAG" = "latest" ]; then
          TAG=$(git describe --abbrev=0 --tags)
        fi

        # Check tag exists (mainly if from input)
        if ! git describe --abbrev=0 --tags "$TAG"; then
          echo "Unable to find git tag '$TAG'"
          exit 1
        fi

        VER=$(echo "$TAG" | perl -pe 's/release_//; s/_/./g')
        echo "Tag: $TAG"
        echo "Version: $VER"
        echo "tag=$TAG" >> $GITHUB_OUTPUT
        echo "version=$VER" >> $GITHUB_OUTPUT

    - id: docker-repo
      name: Ensure docker repo is set
      run: |
        REPO="${{ inputs.repo }}"
        [ -n "$REPO" ] || REPO="$DOCKER_REPOSITORY_DEFAULT"

        echo "Docker repository: $REPO"
        echo "repo=$REPO" >> $GITHUB_OUTPUT

    - id: flags
      name: Check flags
      run: |
        BUILD="${{ github.event.inputs.do_build }}"
        [ -n "$BUILD" ] || BUILD="true"
        echo "build=$BUILD" >> $GITHUB_OUTPUT
        echo "Do build? $BUILD"

        MANIFEST="${{ github.event.inputs.do_manifests }}"
        [ -n "$MANIFEST" ] || MANIFEST="true"
        echo "manifest=$MANIFEST" >> $GITHUB_OUTPUT
        echo "Do manifest? $MANIFEST"

        LATEST="${{ github.event.inputs.update_latest }}"
        [ -n "$LATEST" ] || LATEST="false"
        echo "latest=$LATEST" >> $GITHUB_OUTPUT
        echo "Tag latest? $LATEST"


  #
  #  Run docker target for each given OS and ARCH. This will
  #  build the Docker images.
  #
  build_docker_images:
    needs:
      - get_build_info

    runs-on: ubuntu-24.04

#  Checking github.ref_name stops the build from running when pushing a tag.
    if: |
      github.ref_name == 'v3.2.x'
      && needs.get_build_info.outputs.do_build == 'true'
      && github.repository_owner == 'FreeRADIUS'

    strategy:
      matrix:
        env:
          - { OS: "ubuntu", ARCH: "linux/amd64",    NAME: "amd64" }
          - { OS: "ubuntu", ARCH: "linux/arm/v7",   NAME: "armv7" }
          - { OS: "ubuntu", ARCH: "linux/arm64/v8", NAME: "arm64v8" }
          - { OS: "alpine", ARCH: "linux/amd64",    NAME: "amd64" }
          - { OS: "alpine", ARCH: "linux/arm/v6",   NAME: "armv6" }
          - { OS: "alpine", ARCH: "linux/arm/v7",   NAME: "armv7" }
          - { OS: "alpine", ARCH: "linux/arm64/v8", NAME: "arm64v8" }

      fail-fast: false

    name: "${{ needs.get_build_info.outputs.git_tag }}-${{ matrix.env.OS }}-${{ matrix.env.ARCH }}"

    steps:

    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Regenerate Dockerfiles
      run: |
        rm scripts/docker/dists/*/Dockerfile || true
        make docker.regen

    - name: Set up qemu
      uses: docker/setup-qemu-action@v4

    - name: Build docker image
      run: |
        make docker-${{ matrix.env.OS }} \
          DOCKER_TAG="${{ needs.get_build_info.outputs.docker_repo }}" \
          DOCKER_COMMIT="${{ needs.get_build_info.outputs.git_tag }}" \
          DOCKER_BUILD_ARGS="--no-cache --platform ${{ matrix.env.ARCH }}" \
          DOCKER_VERSION="${{ matrix.env.NAME }}-${{ needs.get_build_info.outputs.version }}"

    - name: Docker login
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_PASSWORD }}

    - name: Push arch image to Docker registry
      shell: bash
      run: |
        make docker-push-${{ matrix.env.OS }} \
          DOCKER_TAG="${{ needs.get_build_info.outputs.docker_repo }}" \
          DOCKER_VERSION="${{ matrix.env.NAME }}-${{ needs.get_build_info.outputs.version }}"


  #
  #  Create/update manifest for *this* version
  #
  #  This maintains the '3.2.x' and '3.2.x-alpine' image tags
  #
  manifest:
    needs:
      - get_build_info
      - build_docker_images

    runs-on: ubuntu-latest

    if: |
      !cancelled()
      && (needs.build_docker_images.result == 'skipped'
          || needs.build_docker_images.result == 'success')
      && needs.get_build_info.outputs.do_manifests == 'true'
      && github.repository_owner == 'FreeRADIUS'

    strategy:
      matrix:
        env:
          - { OS: "ubuntu", ARCHS: "amd64 armv7 arm64v8", SUFFIX: "" }
          - { OS: "alpine", ARCHS: "amd64 armv6 armv7 arm64v8", SUFFIX: "-alpine" }

      fail-fast: false

    name: "manifest-${{ needs.get_build_info.outputs.version }}-${{ matrix.env.OS }}"

    steps:

    - uses: actions/checkout@v6
      with:
        fetch-depth: 1

    - name: Docker login
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_PASSWORD }}

    - name: Create manifests
      shell: bash
      run: |
        make docker-ci-manifest \
          DOCKER_TAG="${{ needs.get_build_info.outputs.docker_repo }}" \
          DOCKER_VERSION="${{ needs.get_build_info.outputs.version }}${{ matrix.env.SUFFIX }}" \
          DOCKER_ARCHS="${{ matrix.env.ARCHS }}"


  #
  #  Create/update manifest for latest version
  #
  #  This maintains the 'latest', 'latest-alpine', 'latest-3.2' and 'latest-3.2-alpine' image tags
  #
  #  This should pretty much always only be run on a new release, unless there
  #  is some serious problem that needs us to set an older version as current.
  #  This is why the default for this is 'false' above.
  #
  latest_manifest:
    needs:
      - get_build_info
      - build_docker_images

    runs-on: ubuntu-latest

    if: |
      !cancelled()
      && (needs.build_docker_images.result == 'skipped'
          || needs.build_docker_images.result == 'success')
      && needs.get_build_info.outputs.update_latest == 'true'
      && github.repository_owner == 'FreeRADIUS'

    strategy:
      matrix:
        env:
          - { OS: "ubuntu", ARCHS: "amd64 armv7 arm64v8", SUFFIX: "" }
          - { OS: "alpine", ARCHS: "amd64 armv6 armv7 arm64v8", SUFFIX: "-alpine" }

      fail-fast: false

    name: "manifest-${{ matrix.env.OS }}-latest"

    steps:

    - uses: actions/checkout@v6
      with:
        fetch-depth: 1

    - name: Docker login
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_PASSWORD }}

    - name: Create 'latest' manifests
      shell: bash
      run: |
        make docker-ci-manifest \
          DOCKER_TAG="${{ needs.get_build_info.outputs.docker_repo }}" \
          DOCKER_VERSION="${{ needs.get_build_info.outputs.version }}${{ matrix.env.SUFFIX }}" \
          DOCKER_MANIFEST_VERSION="latest${{ matrix.env.SUFFIX }}" \
          DOCKER_ARCHS="${{ matrix.env.ARCHS }}"

    - name: Create 'latest-3.2' manifests
      shell: bash
      run: |
        make docker-ci-manifest \
          DOCKER_TAG="${{ needs.get_build_info.outputs.docker_repo }}" \
          DOCKER_VERSION="${{ needs.get_build_info.outputs.version }}${{ matrix.env.SUFFIX }}" \
          DOCKER_MANIFEST_VERSION="latest-3.2${{ matrix.env.SUFFIX }}" \
          DOCKER_ARCHS="${{ matrix.env.ARCHS }}"

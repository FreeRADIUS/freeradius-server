name: Multi-Server CI Tests

on:
  #
  #  `ci-pipeline.yml` calls the multi-server workflow and decides the entry
  #  point:
  #
  #    `push`: per-commit run. The run builds the 'service' and 'profiling'
  #    images from the checked-out commit, so the radiusd under test is
  #    the pushed code. The run pulls only the toolchain layers
  #    ('crossbuild' and 'profiling-deps') from the internal registry,
  #    under whichever tag `common_vars.yml` picks for the pushed ref.
  #    `docker-ci-images-refresh.yml` refreshes the toolchain layers in
  #    the registry. The `push` run runs the CI subset.
  #
  #    `schedule`: nightly full-suite run, from the pipeline's own cron.
  #    The run rebuilds a toolchain layer locally if the registry no
  #    longer holds the layer.
  #
  workflow_call:

jobs:
  #
  #  The `common_vars` job emits different values depending on whether the run
  #  is occurring in the FreeRADIUS organisation or in a fork.  See
  #  `.github/workflows/common_vars.yml`.
  #
  common_vars:
    name: Common vars
    uses: ./.github/workflows/common_vars.yml

  multi-server-tests:
    needs: common_vars
    runs-on: self-hosted
    if: github.repository_owner == 'FreeRADIUS'

    #  The `profiling` leg requests a GitHub OpenID Connect (OIDC) token to
    #  authenticate the upload of the profiling results, so the job needs
    #  `id-token: write`.  When a `permissions` block lists any permission,
    #  GitHub grants only the listed permissions.  The block therefore also
    #  lists `contents: read`, which the checkout step needs.
    permissions:
      contents: read
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        mode: [service, profiling]

    services:
      dind:
        #
        #  Custom Docker-in-Docker (dind) image. The `/etc/docker/daemon.json`
        #  inside the image points at the internal NetworkRADIUS registry as
        #  a Docker Hub pull-through mirror.  The image trusts the internal
        #  certificate authority (CA).
        #  `docker-ci-images-refresh.yml` builds the image from
        #  `scripts/ci/docker/Dockerfile.docker-dind`.
        #
        image: ${{ needs.common_vars.outputs.image_prefix }}self-hosted-docker-dind:${{ needs.common_vars.outputs.image_tag }}
        options: --privileged
        env:
          DOCKER_TLS_CERTDIR: ""
          #  Bypass the squid proxy for internal registry access.
          NO_PROXY: "*.networkradius.com,127.0.0.1"
          #  Fix the network pool so `TEST_SUBNET` is predictable.
          DOCKER_OPTS: "--default-address-pool base=172.16.0.0/12,size=24"
        #
        #  Share the runner's workspace with dind so that docker
        #  compose bind-mounts (`radiusd.conf`, `env-setup.sh`, the
        #  listener directories) resolve to real files inside the
        #  dind daemon.
        #
        #  `github.workspace` is the HOST path to the workspace.
        #  The runner mounts the workspace into the job container
        #  at a different path (`/__w/...`), so we use a fixed mount
        #  point (`/workspace`) that both containers share.
        #
        volumes:
          - ${{ github.workspace }}:/workspace

    container:
      #
      #  Custom CI image with the docker CLI, buildx and m4 added on
      #  top of the 'self-hosted' base image.
      #  `docker-ci-images-refresh.yml` builds the image from
      #  `scripts/ci/docker/Dockerfile.docker-cli`.
      #
      image: ${{ needs.common_vars.outputs.image_prefix }}self-hosted-docker-cli:${{ needs.common_vars.outputs.image_tag }}
      #  The Samba install needs `privileged`
      #  `memory-swap -1` enables full use of host swap and may stop
      #    containers from randomly quitting with "The operation was
      #    canceled"
      options: >-
        --privileged
        --memory-swap -1
      env:
        DOCKER_HOST: tcp://dind:2375
        NO_PROXY: dind,*.networkradius.com,127.0.0.1
      #
      #  The CA certificate mount lets apt and curl inside the
      #  container reach the internal registry over HTTPS. The job
      #  container shares the workspace volume with dind (see the
      #  dind `volumes` comment above).
      #
      volumes:
        - /usr/local/share/ca-certificates/networkradius.com.crt:/usr/local/share/ca-certificates/networkradius.com.crt:ro
        - ${{ github.workspace }}:/workspace

    defaults:
      run:
        working-directory: /workspace

    steps:

      - uses: actions/checkout@v6
        id: checkout
        with:
          lfs: false

      - name: setup-dind
        uses: ./.github/actions/setup-dind

      #
      #  Authenticate dind to Docker Hub. 'self-hosted-docker-dind'
      #  lists the internal registry in `registry-mirrors`, but the
      #  internal registry is not actually a Hub pull-through cache
      #  (the internal registry returns 404 for Hub paths such as
      #  `library/kafka`).  dockerd therefore falls back to 'docker.io',
      #  and we hit anonymous rate limits during compose pulls.
      #  Docker Hub allows 5000 authenticated pulls per day.
      #
      - name: Login to Docker Hub (via dind)
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_READ_USER }}
          password: ${{ secrets.DOCKERHUB_READ_KEY }}

      #
      #  Authenticate dind to the internal registry so that docker
      #  compose can pull the 'mariadb', 'postgres' and '389ds' images
      #  tagged under the internal registry. The runner's `job-started`
      #  hook logs the host docker daemon in, but dind is a separate
      #  daemon with no authentication configured.
      #
      - name: Login to internal Docker registry
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_REPO_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_REPO_PASSWORD }}
        run: |
          echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin https://${{ needs.common_vars.outputs.docker_registry }}/

      #
      #  Build the FreeRADIUS image for the matrix leg. `service` mode
      #  uses the standard 'service' image. `profiling` mode uses the
      #  standard 'profiling' image (FreeRADIUS compiled with `CFLAGS`
      #  suited to callgrind via
      #  `scripts/docker/m4/common.freeradius-profile-build.m4`).
      #
      #  Both images must hold the radiusd built from the checked-out
      #  commit, otherwise the tests exercise whatever code the registry
      #  copy was built from.
      #
      #  `DOCKER_REGISTRY` tells `scripts/docker/docker.mk` to try pulling
      #  `freeradius4-<type>/<image>:<tag>` from the internal registry
      #  before building locally, and to retag a pulled image as
      #  `:<sha>`.  That is wanted for the toolchain layers ('crossbuild'
      #  and 'profiling-deps'), which the 'profiling' build sits on top
      #  of and which `docker-freeradius-images-refresh.yml` publishes.
      #
      #  The 'service' image is also published by the refresh workflow,
      #  so without `NOPULL=1` the service leg would pull the refresh's
      #  copy and test the code from the last refresh, not this commit.
      #  `NOPULL=1` forces the local build.  The 'service' Dockerfile
      #  `FROM`s the upstream OS base, so the build needs no pulled layer.
      #
      #  Nothing publishes a 'profiling' image, so the 'profiling' pull
      #  misses and `docker.mk` builds the layer from the checkout.
      #
      - name: Build FreeRADIUS image (${{ matrix.mode }})
        env:
          DOCKER_REGISTRY: ${{ needs.common_vars.outputs.docker_registry }}
          DOCKER_REMOTE_PREFIX: ${{ needs.common_vars.outputs.image_prefix }}
          DOCKER_REMOTE_TAG: ${{ needs.common_vars.outputs.image_tag }}
        run: |
          case "${{ matrix.mode }}" in
            service)
              NOPULL=1 make docker.service.ubuntu24
              ;;
            profiling)
              make docker.profiling.ubuntu24
              ;;
          esac

      - name: Show docker build logs
        if: failure()
        run: |
          for type in crossbuild profiling-deps profiling service; do
            log="build/docker/build.ubuntu24.$type"
            if [ -f "$log" ]; then
              echo "===== $log ====="
              cat "$log"
            fi
          done

      #
      #  `schedule` runs the full test set, and a `push` runs the CI
      #  subset.  `github.event_name` is the caller's event, so the
      #  pipeline's nightly run selects the full set here without an
      #  extra input.
      #
      - name: Run multi-server tests (${{ matrix.mode }})
        run: |
          case "${{ matrix.mode }}-${{ github.event_name }}" in
            service-schedule)
              make -j$(nproc) test.multi-server
              ;;
            service-*)
              make -j$(nproc) test.multi-server.ci
              ;;
            profiling-schedule)
              make -j$(nproc) test.multi-server.profiling
              ;;
            profiling-*)
              make -j$(nproc) test.multi-server.profiling.ci
              ;;
          esac

      #  The collect step runs before both uploads below.  The step's
      #  `move: true` option moves a core out of `prof-results/`, so a core
      #  is uploaded once and does not inflate the `prof-results` artifact or
      #  the store publish.
      #  The `checkout` step writes the `collect-core-dumps` action into the
      #  workspace, so the step runs only when the `checkout` step succeeds.
      - name: Collect core dumps
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        uses: ./.github/actions/collect-core-dumps
        with:
          name: ${{ matrix.mode }}-${{ github.sha }}
          move: "true"

      #
      #  Upload callgrind output as a workflow artifact in `profiling`
      #  mode. `service` mode produces nothing to upload, so the step
      #  does not run in `service` mode.
      #
      - name: Upload profiling results
        id: upload-prof-results
        if: ${{ matrix.mode == 'profiling' && always() }}
        uses: actions/upload-artifact@v6
        with:
          name: prof-results-${{ github.sha }}
          path: prof-results/
          if-no-files-found: ignore

      #
      #  Publish the same `prof-results/` tree to the durable store. The script
      #  tars the tree and POSTs the tar, with a GitHub OIDC token, to the
      #  given URL (see the script header). The step does not run when the
      #  artifact step found no files (empty `artifact-id`).
      #
      - name: Publish profiling results to the prof-results store
        if: ${{ matrix.mode == 'profiling' && always() && steps.upload-prof-results.outputs.artifact-id != '' }}
        run: scripts/ci/publish-profiling-results.sh "https://cinfra-ca.inkbridge.io/profiling/data"

      #
      #  Check latest profiling results vs each suite's previous run on the store.
      #
      #  cest-analyzer exit codes:
      #   0 - clean
      #   1 - latest result performance flagged
      #   2 - tool error
      #
      - name: Check latest profiling results vs previous runs
        if: ${{ matrix.mode == 'profiling' && success() }}
        continue-on-error: true
        run: |
          curl -fsSL -o cest-analyzer \
            "https://cinfra-ca.inkbridge.io/profiling/dashboard/bin/cest-analyzer"
          chmod +x ./cest-analyzer
          rc=0
          ./cest-analyzer --latest -d prof-results --filter fr_ --gate 15 || rc=$?
          echo "cest-analyzer exit code: $rc"

      #
      #  If the CI has failed and the branch is `ci-debug` then the workflow starts
      #  a tmate session.  See the tmate comment in `ci.yml` for the walkthrough.
      #
      - name: "Debug: Start tmate"
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: true
        if: ${{ github.ref == 'refs/heads/ci-debug' && failure() }}

name: CI Pipeline

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - coverity_scan
      - run-fuzzer**
      - debug-fuzzer-**
  pull_request:
  schedule:
    - cron: '0 20 * * *'

#
#  Cancel any in-flight or queued run of this workflow on the same branch.
#
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  #
  #  Determines which registry the images live in, which tag of them this ref
  #  should use, and whether this ref changes anything they bake in.  See
  #  .github/workflows/common_vars.yml.
  #
  common_vars:
    uses: ./.github/workflows/common_vars.yml

  #
  #  Skipped on the vast majority of commits.  When it does run every leg
  #  waits for it, so the docker images have all necessary packages before
  #  the rest of CI runs.
  #
  #  Only a push rebuilds, because only a push publishes, and a pull request
  #  has no tag of its own to publish to.  A branch publishes under a tag
  #  named after the branch, so the images the default branch reads are never
  #  overwritten by somebody's work in progress.  A fork has no images at all
  #  until it builds them, so a fork always refreshes, into its own registry
  #  where it can overwrite nothing but its own tags.
  #
  refresh:
    name: Docker refresh
    needs: [common_vars]
    if: ${{ (github.event_name == 'push' && needs.common_vars.outputs.images == 'true') || github.repository_owner != 'FreeRADIUS' }}
    uses: ./.github/workflows/docker-refresh.yml
    secrets: inherit

  ci:
    needs: [refresh]
    if: ${{ !cancelled() && needs.refresh.result != 'failure' }}
    name: CI
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  ci-deb:
    needs: [refresh]
    if: ${{ !cancelled() && needs.refresh.result != 'failure' }}
    name: CI DEB
    uses: ./.github/workflows/ci-deb.yml
    secrets: inherit

  ci-rpm:
    needs: [refresh]
    if: ${{ !cancelled() && needs.refresh.result != 'failure' }}
    name: CI RPM
    uses: ./.github/workflows/ci-rpm.yml
    secrets: inherit

  ci-sanitizers:
    needs: [refresh]
    if: ${{ !cancelled() && needs.refresh.result != 'failure' }}
    name: CI-Sanitizers
    uses: ./.github/workflows/ci-sanitizers.yml
    secrets: inherit

  #
  #  Run on every commit but absent from merge's needs, because they're
  #  too unreliable.
  #
  ci-freebsd:
    needs: [refresh]
    if: ${{ !cancelled() && needs.refresh.result != 'failure' }}
    name: CI FreeBSD
    uses: ./.github/workflows/ci-freebsd.yml
    secrets: inherit

  ci-macos:
    needs: [refresh]
    if: ${{ !cancelled() && needs.refresh.result != 'failure' }}
    name: CI macOS
    uses: ./.github/workflows/ci-macos.yml
    secrets: inherit

  ci-multi-server:
    needs: [refresh]
    if: ${{ !cancelled() && needs.refresh.result != 'failure' }}
    name: Multi-Server CI Tests
    uses: ./.github/workflows/ci-multi-server-tests.yml
    secrets: inherit

  docker-crossbuild:
    name: Docker crossbuild images
    needs: [refresh, ci]
    if: ${{ !cancelled() && needs.refresh.result != 'failure' && needs.ci.result == 'success' && github.repository_owner == 'FreeRADIUS' }}
    uses: ./.github/workflows/docker-crossbuild.yml
    secrets: inherit

  docker-service:
    name: Docker service images
    needs: [refresh, ci]
    if: ${{ !cancelled() && needs.refresh.result != 'failure' && needs.ci.result == 'success' && github.repository_owner == 'FreeRADIUS' }}
    uses: ./.github/workflows/docker-service.yml
    secrets: inherit

  #
  #  Merges when every gating leg passed.  Only the gating legs are listed;
  #  the other legs are too unreliable to block a merge on.
  #
  #  By default a job is skipped unless every job it depends on with "needs"
  #  succeeds.  Docker refresh is skipped on commits that don't modify
  #  packaging, and that causes the merge step to be skipped, unless we add an
  #  explicit condition.
  #
  #
  #  Only runs when the commit changes something the documentation is built
  #  from, which is what the workflow's own paths filter used to decide before
  #  the workflow moved in here.  Absent from merge's needs: a documentation
  #  build failing should not hold up a merge.
  #
  docs:
    name: Documentation
    needs: [common_vars, refresh]
    if: ${{ !cancelled() && needs.refresh.result != 'failure' && needs.common_vars.outputs.docs == 'true' }}
    uses: ./.github/workflows/documentation.yml
    secrets: inherit

  merge:
    needs: [ci, ci-deb, ci-rpm, ci-sanitizers]
    if: ${{ !cancelled()
            && needs.ci.result == 'success'
            && needs.ci-deb.result == 'success'
            && needs.ci-rpm.result == 'success'
            && needs.ci-sanitizers.result == 'success' }}
    uses: ./.github/workflows/merge-upstream.yml
    secrets:
      GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}

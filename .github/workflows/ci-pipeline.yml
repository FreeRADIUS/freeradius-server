name: CI Pipeline

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - coverity_scan
      - run-fuzzer**
      - debug-fuzzer-**
  pull_request:
  schedule:
    - cron: '0 20 * * *'

#
#  Cancel any in-flight or queued run of this workflow on the same branch.
#
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  #
  #  Anything baked into the CI Docker images has to be updated before any of
  #  the main CI jobs run against them.  This _should_ in theory catch any new
  #  modules that are added, as long as they're packaged.
  #
  changes:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.check.outputs.images }}
    steps:
      #  paths-filter diffs (below) needs a checkout of the repository.
      - uses: actions/checkout@v6
        with:
          lfs: false

      #
      #  Only refresh the docker image if we think any of the files which
      #  might pull in additional dependencies have changed.  We ONLY do 
      #  this on push, not pull requests so we don't poison our docker 
      #  images.  We really need to figure out how to qualify the images
      #  so we can generate dedicated images for PRs.
      #
      - uses: dorny/paths-filter@v4.0.3
        id: check
        if: github.event_name == 'push'
        with:
          base: ${{ github.event.pull_request.base.sha || github.event.before }}
          filters: |
            images:
              - 'debian/**'
              - 'redhat/**'
              - 'scripts/ci/extra-packages.debian.control'
              - 'scripts/ci/docker/Dockerfile*'
              - 'scripts/docker/build/*/Dockerfile.ci'
              - 'scripts/docker/build/*/Dockerfile.crossbuild'
              - 'scripts/docker/build/*/Dockerfile.profiling-deps'
              - 'scripts/docker/build/*/Dockerfile.service'

  #
  #  Skipped on the vast majority of commits.  When it does run every leg
  #  waits for it, so the docker images have all necessary packages before
  #  the rest of CI runs.
  #
  #
  #  A fork has no image until it builds one, so it always refreshes; buildx
  #  layer reuse from its own GHCR makes the unchanged case cheap.  The org
  #  only refreshes when a commit touches something baked into the images.
  #
  refresh:
    name: Docker refresh
    needs: [changes]
    if: ${{ needs.changes.outputs.images == 'true' || github.repository_owner != 'FreeRADIUS' }}
    uses: ./.github/workflows/docker-refresh.yml
    secrets: inherit

  ci:
    needs: [changes, refresh]
    if: ${{ !cancelled() && needs.refresh.result != 'failure' }}
    name: CI
    uses: ./.github/workflows/ci.yml
    with:
      packaging_changed: ${{ needs.changes.outputs.images }}
    secrets: inherit

  ci-deb:
    needs: [changes, refresh]
    if: ${{ !cancelled() && needs.refresh.result != 'failure' }}
    name: CI DEB
    uses: ./.github/workflows/ci-deb.yml
    secrets: inherit

  ci-rpm:
    needs: [changes, refresh]
    if: ${{ !cancelled() && needs.refresh.result != 'failure' }}
    name: CI RPM
    uses: ./.github/workflows/ci-rpm.yml
    with:
      packaging_changed: ${{ needs.changes.outputs.images }}
    secrets: inherit

  ci-sanitizers:
    needs: [changes, refresh]
    if: ${{ !cancelled() && needs.refresh.result != 'failure' }}
    name: CI-Sanitizers
    uses: ./.github/workflows/ci-sanitizers.yml
    with:
      packaging_changed: ${{ needs.changes.outputs.images }}
    secrets: inherit

  #
  #  Run on every commit but absent from merge's needs, because they're
  #  too unreliable.
  #
  ci-freebsd:
    needs: [refresh]
    if: ${{ !cancelled() && needs.refresh.result != 'failure' }}
    name: CI FreeBSD
    uses: ./.github/workflows/ci-freebsd.yml
    secrets: inherit

  ci-macos:
    needs: [refresh]
    if: ${{ !cancelled() && needs.refresh.result != 'failure' }}
    name: CI macOS
    uses: ./.github/workflows/ci-macos.yml
    secrets: inherit

  ci-multi-server:
    needs: [changes, refresh]
    if: ${{ !cancelled() && needs.refresh.result != 'failure' }}
    name: Multi-Server CI Tests
    uses: ./.github/workflows/ci-multi-server-tests.yml
    secrets: inherit

  docker-crossbuild:
    name: Docker crossbuild images
    needs: [changes, refresh, ci]
    if: ${{ !cancelled() && needs.refresh.result != 'failure' && needs.ci.result == 'success' && github.repository_owner == 'FreeRADIUS' }}
    uses: ./.github/workflows/docker-crossbuild.yml
    secrets: inherit

  docker-service:
    name: Docker service images
    needs: [changes, refresh, ci]
    if: ${{ !cancelled() && needs.refresh.result != 'failure' && needs.ci.result == 'success' && github.repository_owner == 'FreeRADIUS' }}
    uses: ./.github/workflows/docker-service.yml
    secrets: inherit

  #
  #  No if:, so the default applies: runs only when every leg it needs
  #  succeeded, and is skipped otherwise.  Only the gating legs are listed.
  #
  merge:
    needs: [ci, ci-deb, ci-rpm, ci-sanitizers]
    uses: ./.github/workflows/merge-upstream.yml
    secrets:
      GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}

name: CI Pipeline

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - coverity_scan
      - run-fuzzer**
      - debug-fuzzer-**
  pull_request:
  schedule:
    - cron: '0 20 * * *'

#
#  Cancel any in-flight or queued run of this workflow on the same branch.
#
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  #
  #  Anything baked into the CI Docker images has to be updated before any of
  #  the main CI jobs run against them.  This _should_ in theory catch any new
  #  modules that are added, as long as they're packaged.
  #
  changes:
    runs-on: ubuntu-latest

    #  On a pull request paths-filter asks the REST API which files changed,
    #  rather than diffing locally, and the API call needs this.
    permissions:
      contents: read
      pull-requests: read

    outputs:
      images: ${{ steps.check.outputs.images }}
    steps:
      #  paths-filter diffs (below) needs a checkout of the repository.
      - uses: actions/checkout@v6
        with:
          lfs: false

      #
      #  Answers one question: does this commit touch anything the CI images
      #  bake in?  Two jobs read the answer and do different things with the
      #  answer.  The refresh job rebuilds the images, and only on a push,
      #  because a rebuild publishes a :latest tag and a pull request must not
      #  be able to overwrite what everybody else builds against.  The build
      #  legs read the answer as packaging_changed and top up their build
      #  dependencies from the tree, which is what covers a pull request that
      #  adds a dependency and cannot wait for its own merge.
      #
      #  So the answer is worked out for a pull request as well as a push, and
      #  the refresh job carries the push-only restriction itself.
      #
      - uses: dorny/paths-filter@v4.0.3
        id: check
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        with:
          base: ${{ github.event.pull_request.base.sha || github.event.before }}
          filters: |
            images:
              - 'debian/**'
              - 'redhat/**'
              - 'scripts/ci/extra-packages.debian.control'
              - 'scripts/ci/docker/Dockerfile*'
              - 'scripts/docker/build/*/Dockerfile.ci'
              - 'scripts/docker/build/*/Dockerfile.crossbuild'
              - 'scripts/docker/build/*/Dockerfile.profiling-deps'
              - 'scripts/docker/build/*/Dockerfile.service'

  #
  #  Skipped on the vast majority of commits.  When it does run every leg
  #  waits for it, so the docker images have all necessary packages before
  #  the rest of CI runs.
  #
  #  A rebuild publishes a :latest tag that everybody else then builds
  #  against, so the main repository rebuilds on a push and never on a pull
  #  request.  A fork has no image until it builds one, so a fork always
  #  refreshes; buildx layer reuse from its own GHCR makes the unchanged case
  #  cheap, and a fork can only overwrite its own tags.
  #
  refresh:
    name: Docker refresh
    needs: [changes]
    if: ${{ (github.event_name == 'push' && needs.changes.outputs.images == 'true') || github.repository_owner != 'FreeRADIUS' }}
    uses: ./.github/workflows/docker-refresh.yml
    secrets: inherit

  ci:
    needs: [changes, refresh]
    if: ${{ !cancelled() && needs.refresh.result != 'failure' }}
    name: CI
    uses: ./.github/workflows/ci.yml
    with:
      packaging_changed: ${{ needs.changes.outputs.images }}
    secrets: inherit

  ci-deb:
    needs: [changes, refresh]
    if: ${{ !cancelled() && needs.refresh.result != 'failure' }}
    name: CI DEB
    uses: ./.github/workflows/ci-deb.yml
    with:
      packaging_changed: ${{ needs.changes.outputs.images }}
    secrets: inherit

  ci-rpm:
    needs: [changes, refresh]
    if: ${{ !cancelled() && needs.refresh.result != 'failure' }}
    name: CI RPM
    uses: ./.github/workflows/ci-rpm.yml
    with:
      packaging_changed: ${{ needs.changes.outputs.images }}
    secrets: inherit

  ci-sanitizers:
    needs: [changes, refresh]
    if: ${{ !cancelled() && needs.refresh.result != 'failure' }}
    name: CI-Sanitizers
    uses: ./.github/workflows/ci-sanitizers.yml
    with:
      packaging_changed: ${{ needs.changes.outputs.images }}
    secrets: inherit

  #
  #  Run on every commit but absent from merge's needs, because they're
  #  too unreliable.
  #
  ci-freebsd:
    needs: [refresh]
    if: ${{ !cancelled() && needs.refresh.result != 'failure' }}
    name: CI FreeBSD
    uses: ./.github/workflows/ci-freebsd.yml
    secrets: inherit

  ci-macos:
    needs: [refresh]
    if: ${{ !cancelled() && needs.refresh.result != 'failure' }}
    name: CI macOS
    uses: ./.github/workflows/ci-macos.yml
    secrets: inherit

  ci-multi-server:
    needs: [changes, refresh]
    if: ${{ !cancelled() && needs.refresh.result != 'failure' }}
    name: Multi-Server CI Tests
    uses: ./.github/workflows/ci-multi-server-tests.yml
    secrets: inherit

  docker-crossbuild:
    name: Docker crossbuild images
    needs: [changes, refresh, ci]
    if: ${{ !cancelled() && needs.refresh.result != 'failure' && needs.ci.result == 'success' && github.repository_owner == 'FreeRADIUS' }}
    uses: ./.github/workflows/docker-crossbuild.yml
    secrets: inherit

  docker-service:
    name: Docker service images
    needs: [changes, refresh, ci]
    if: ${{ !cancelled() && needs.refresh.result != 'failure' && needs.ci.result == 'success' && github.repository_owner == 'FreeRADIUS' }}
    uses: ./.github/workflows/docker-service.yml
    secrets: inherit

  #
  #  Merges when every gating leg passed.  Only the gating legs are listed;
  #  the other legs are too unreliable to block a merge on.
  #
  #  By default a job is skipped unless every job it depends on with "needs"
  #  succeeds.  Docker refresh is skipped on commits that don't modify
  #  packaging, and that causes the merge step to be skipped, unless we add an
  #  explicit condition.
  #
  merge:
    needs: [ci, ci-deb, ci-rpm, ci-sanitizers]
    if: ${{ !cancelled()
            && needs.ci.result == 'success'
            && needs.ci-deb.result == 'success'
            && needs.ci-rpm.result == 'success'
            && needs.ci-sanitizers.result == 'success' }}
    uses: ./.github/workflows/merge-upstream.yml
    secrets:
      GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}

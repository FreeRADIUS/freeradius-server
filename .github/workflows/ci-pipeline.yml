name: CI Pipeline

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - coverity_scan
      - run-fuzzer**
      - debug-fuzzer-**
  pull_request:
  schedule:
    - cron: '0 20 * * *'

#
#  Cancel any in-flight or queued run of this workflow on the same branch when a
#  new commit lands, so only the newest commit gets tested. head_ref names the
#  source branch on pull_request events and ref_name covers push events, so
#  keying on either rather than on github.ref stops a branch with an open pull
#  request from running two full sets of jobs.
#
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

#
#  BRANCH-LOCAL: every leg except the multi-server tests is removed while the
#  profiling result check is developed on this branch. Restore the full job
#  list from master before merging.
#
jobs:
  ci-multi-server:
    name: Multi-Server CI Tests
    uses: ./.github/workflows/ci-multi-server-tests.yml
    secrets: inherit
